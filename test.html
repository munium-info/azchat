<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AzChat</title>
<style>
  :root{
    --bg:#F2F2F2; --bg2:#FFFFFF; --panel:#F1F2F5; --panel2:#E7E9EE;
    --ink:#191919; --sub:#9A9A9A; --line:#E6E6E6;
    --acc:#07C160; --green:#07C160;
    --bubble-me:#95EC69;
    --bubble-me-text:#191919;
    --bubble-them:#FFFFFF;
    --unread:#FA5151; --warn:#D19A1E;
    --shadow:0 1px 3px rgba(20,30,60,.06);
    --shadow-lg:0 8px 30px rgba(20,30,60,.12);
  }
  html.dark{
    --bg:#0D0F14; --bg2:#13161D; --panel:#1B1F2A; --panel2:#242A38;
    --ink:#E8EAF0; --sub:#7A8194; --line:#252B3A;
    --bubble-me:#2BA245;
    --bubble-me-text:#FFFFFF;
    --bubble-them:#232939; --warn:#FFB020;
    --shadow:none;
    --shadow-lg:0 8px 30px rgba(0,0,0,.5);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-size:14px;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
    transition:background .25s,color .25s}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;outline:none}
  [hidden]{display:none !important}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:3px}

  #toast{position:fixed;top:24px;left:50%;transform:translate(-50%,-90px);z-index:900;
    background:var(--bg2);color:var(--ink);padding:11px 22px;border-radius:12px;font-size:13px;
    box-shadow:var(--shadow-lg);border:1px solid var(--line);
    transition:transform .35s cubic-bezier(.2,.9,.3,1.1);pointer-events:none;
    max-width:88vw;text-align:center;word-break:break-all}
  #toast.show{transform:translate(-50%,0)}
  #toast.err{border-color:var(--unread);color:var(--unread)}

  #ctxMenu{position:fixed;z-index:800;background:var(--bg2);border:1px solid var(--line);
    border-radius:12px;padding:6px;min-width:150px;box-shadow:var(--shadow-lg);
    animation:ctxIn .15s ease}
  @keyframes ctxIn{from{opacity:0;transform:scale(.94)}}
  .ctx-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;
    font-size:13.5px;cursor:pointer;user-select:none}
  .ctx-item:hover{background:rgba(7,193,96,.08)}
  .ctx-item.danger{color:var(--unread)}
  .ctx-item.danger:hover{background:rgba(250,81,81,.08)}
  .ctx-item .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .ctx-sep{height:1px;background:var(--line);margin:5px 8px}

  #authView{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
  .auth-card{width:100%;max-width:360px}
  .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;
    background:var(--acc);display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:30px;font-weight:700;box-shadow:0 8px 30px rgba(7,193,96,.25)}
  .auth-title{text-align:center;font-size:22px;font-weight:700;letter-spacing:-.02em}
  .auth-sub{text-align:center;font-size:12.5px;color:var(--sub);margin:6px 0 30px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:7px}
  .field input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;font-size:14px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
  .field input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(7,193,96,.12)}
  .field input.uid-input{font-family:ui-monospace,Menlo,monospace;letter-spacing:.1em;text-align:center}
  .field .hint{font-size:11px;color:var(--sub);margin-top:6px}
  .remember-row{display:flex;align-items:center;gap:8px;margin:-4px 0 14px;font-size:13px;color:var(--sub);cursor:pointer}
  .remember-row input{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
  .form-err{color:var(--unread);font-size:12.5px;min-height:20px;margin-bottom:8px}
  .btn-primary{width:100%;background:var(--acc);color:#fff;border-radius:12px;padding:14px;
    font-size:15px;font-weight:600;transition:transform .15s,box-shadow .2s;
    box-shadow:0 6px 20px rgba(7,193,96,.2)}
  .btn-primary:hover{transform:translateY(-1px)}
  .tabs{display:flex;background:var(--panel);border-radius:12px;padding:4px;margin-bottom:24px}
  .tabs button{flex:1;padding:10px;border-radius:9px;font-size:13.5px;color:var(--sub);transition:all .2s}
  .tabs button.on{background:var(--bg2);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
  .auth-note{margin-top:28px;font-size:11.5px;color:var(--sub);text-align:center;line-height:2}

  #appView{height:100%;display:flex}
  #sidebar{width:290px;background:var(--bg2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0}
  .sb-head{margin:10px 10px 0;padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;
    border-radius:14px;transition:background .15s}
  .sb-head:hover{background:var(--panel)}
  .avatar{width:44px;height:44px;border-radius:12px;color:#fff;font-size:17px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;
    background:var(--acc)}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
  .sb-me-name{font-size:14.5px;font-weight:600}
  .sb-me-uid{font-size:10.5px;color:var(--sub);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
  .net-status{margin:6px 16px 8px;padding:8px 12px;font-size:11.5px;color:var(--sub);
    background:var(--panel);border-radius:10px;line-height:1.5}
  .btn-row{display:flex;gap:8px;padding:0 12px 8px}
  .btn-row button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
    background:var(--acc);color:#fff;border-radius:11px;
    padding:10px 4px;font-size:12.5px;font-weight:500;transition:all .15s}
  .btn-row button:hover{opacity:.9}
  .sb-label{padding:10px 20px 6px;font-size:10.5px;color:var(--sub);letter-spacing:.14em;font-weight:600}
  #contactList{flex:1;overflow-y:auto;padding:0 10px 10px}
  .c-item{display:flex;align-items:center;gap:11px;padding:10px;cursor:pointer;position:relative;
    border-radius:12px;transition:background .15s;margin-bottom:2px}
  .c-item:hover{background:var(--panel)}
  .c-item.on{background:rgba(7,193,96,.08)}
  html.dark .c-item.on{background:rgba(7,193,96,.14)}
  .avatar.sm{width:42px;height:42px;font-size:16px}
  .c-info{flex:1;min-width:0}
  .c-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-uid{font-size:10.5px;color:var(--sub);font-family:ui-monospace,Menlo,monospace}
  .c-dot{position:absolute;left:44px;top:8px;min-width:17px;height:17px;border-radius:9px;background:var(--unread);
    color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
  .c-empty{padding:40px 24px;text-align:center;color:var(--sub);font-size:12.5px;line-height:2}
  .sb-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px}
  .sb-foot button{flex:1;padding:9px 2px;font-size:11.5px;color:var(--sub);border-radius:9px;transition:all .15s;
    display:flex;align-items:center;justify-content:center;gap:4px}
  .sb-foot button:hover{background:var(--panel);color:var(--ink)}
  .sb-foot button .ic svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}

  #chatPane{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  #chatEmpty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--sub)}
  #chatEmpty .logo{width:56px;height:56px;font-size:26px;opacity:.35}
  .chat-head{padding:14px 22px;background:var(--bg2);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px}
  .btn-back{display:none;width:30px;height:30px;color:var(--sub);align-items:center;justify-content:center;font-size:20px;border-radius:8px}
  .btn-back:hover{background:var(--panel)}
  .ch-name{font-size:15.5px;font-weight:600}
  .ch-uid{font-size:10.5px;color:var(--sub);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
  .ch-status{margin-left:auto;font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .btn-more{width:32px;height:32px;color:var(--sub);font-size:16px;display:flex;align-items:center;justify-content:center;border-radius:9px}
  .btn-more:hover{background:var(--panel);color:var(--ink)}
  .dot{width:7px;height:7px;border-radius:50%;background:#C8CCD6}
  html.dark .dot{background:#4A5060}
  .dot.live{background:var(--green)}
  #msgs{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
  .t-div{align-self:center;font-size:11px;color:var(--sub);background:var(--panel);
    border-radius:20px;padding:4px 12px}
  .announce{align-self:stretch;background:rgba(209,154,30,.08);border:1px solid rgba(209,154,30,.3);
    border-radius:14px;padding:12px 16px;font-size:13px;line-height:1.6}
  .announce b{color:var(--warn);display:block;margin-bottom:4px;font-size:11.5px}
  .announce b .ic svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
  .m-row{display:flex;gap:10px;max-width:78%;align-items:flex-start}
  .m-row.me{flex-direction:row-reverse;align-self:flex-end}
  .m-row.them{align-self:flex-start}
  .m-avatar{width:34px;height:34px;border-radius:10px;color:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;overflow:hidden;cursor:pointer}
  .m-col{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
  .m-sender{font-size:11px;color:var(--sub);padding:0 6px}
  .m-bubble{padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.6;
    white-space:pre-wrap;word-break:break-word;position:relative;user-select:text}
  .m-bubble.has-media{padding:5px;background:var(--bubble-them) !important;white-space:normal;box-shadow:var(--shadow)}
  .m-bubble.has-media img,.m-bubble.has-media video{max-width:200px;max-height:200px;border-radius:12px;display:block;cursor:zoom-in}
  .them .m-bubble{background:var(--bubble-them);border-top-left-radius:5px;box-shadow:var(--shadow)}
  .me .m-bubble{background:var(--bubble-me);color:var(--bubble-me-text);border-top-right-radius:5px;
    box-shadow:var(--shadow)}
  .me .m-bubble.has-media{background:var(--bubble-them) !important;color:var(--ink);box-shadow:var(--shadow)}
  .m-mention{background:rgba(7,193,96,.14);color:var(--acc);border-radius:5px;padding:1px 5px;font-weight:600}
  .me .m-mention{background:rgba(0,0,0,.12);color:var(--bubble-me-text)}
  .m-pending{font-size:10px;color:rgba(0,0,0,.45);margin-left:5px}
  html.dark .m-pending{color:rgba(255,255,255,.65)}
  .m-read{font-size:10px;color:rgba(0,0,0,.5);margin-left:5px}
  html.dark .m-read{color:rgba(255,255,255,.7)}
  .m-recalled{font-size:12.5px;color:var(--sub);font-style:italic;background:var(--panel) !important;
    border:1px dashed var(--line);box-shadow:none !important}
  .m-audio{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:120px}
  .m-audio .play-ic{width:20px;text-align:center}
  .m-audio .play-ic .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .m-audio .bar{flex:1;height:24px;display:flex;align-items:center;gap:2.5px}
  .m-audio .bar i{width:2.5px;background:currentColor;opacity:.55;border-radius:2px;display:block}
  .m-audio.playing .bar i{animation:barPulse 1s infinite}
  @keyframes barPulse{50%{opacity:.2}}
  .m-audio .dur{font-size:11px;color:var(--sub);flex-shrink:0;font-family:ui-monospace,Menlo,monospace}
  .m-link{color:var(--acc);text-decoration:none;cursor:pointer;word-break:break-all}
  .m-link:hover{text-decoration:underline}
  /* 视频播放器 */
  .m-video{position:relative;border-radius:12px;overflow:hidden;background:#000;cursor:pointer}
  .m-video video{display:block;max-width:200px;max-height:200px;width:auto}
  .m-video .v-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.25);transition:background .15s}
  .m-video:hover .v-play{background:rgba(0,0,0,.1)}
  .m-video .v-play .v-ic{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center}
  .m-video .v-play .v-ic svg{width:16px;height:16px;fill:var(--ink);stroke:none;margin-left:2px}
  .m-video .v-dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;
    font-size:10px;padding:1px 6px;border-radius:4px;font-family:ui-monospace,Menlo,monospace}
  .m-video .v-size{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;
    font-size:10px;padding:1px 6px;border-radius:4px;font-family:ui-monospace,Menlo,monospace}
  /* 视频全屏查看 */
  #vidViewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:560;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  #vidViewer video{max-width:94vw;max-height:84vh;border-radius:10px;outline:none}
  .vv-bar{margin-top:14px;display:flex;gap:12px}
  .vv-bar button{color:#fff;font-size:13.5px;padding:9px 20px;border-radius:10px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
  .vv-bar button:hover{background:rgba(255,255,255,.2)}

  .composer-wrap{background:var(--bg2);border-top:1px solid var(--line)}
  #emojiPanel{background:var(--panel);padding:12px 16px;max-height:230px;overflow-y:auto;
    margin:0 10px;border-radius:14px 14px 0 0}
  .ep-tabs{display:flex;gap:8px;margin-bottom:10px}
  .ep-tabs button{color:var(--sub);padding:5px 12px;border-radius:8px;font-size:12.5px}
  .ep-tabs button.on{color:var(--ink);font-weight:600;background:var(--bg2);box-shadow:var(--shadow)}
  .emoji-grid{display:flex;flex-wrap:wrap;gap:3px}
  .emoji-grid button{width:35px;height:35px;font-size:21px;border-radius:8px;line-height:1;transition:transform .1s}
  .emoji-grid button:hover{background:var(--bg2);transform:scale(1.15)}
  .sticker-grid{display:flex;flex-wrap:wrap;gap:8px}
  .sticker-grid .stk{width:56px;height:56px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);
    padding:3px;cursor:pointer;object-fit:contain;transition:transform .12s}
  .sticker-grid .stk:hover{transform:scale(1.08);border-color:var(--acc)}
  .sticker-add{width:56px;height:56px;border-radius:10px;border:1px dashed var(--panel2);color:var(--sub);
    font-size:22px;display:flex;align-items:center;justify-content:center;background:var(--bg2)}
  .sticker-add:hover{border-color:var(--acc);color:var(--acc)}
  #mentionPanel{position:absolute;bottom:64px;left:56px;background:var(--bg2);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:60;max-height:200px;
    overflow-y:auto;min-width:190px;animation:ctxIn .15s ease}
  .mn-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
  .mn-item:hover{background:var(--panel)}
  .mn-item .avatar{width:28px;height:28px;font-size:11px}
  .mn-all{color:var(--unread);font-weight:600}
  .composer{display:flex;gap:9px;padding:12px 16px 16px;align-items:center;position:relative}
  .btn-emoji,.btn-mic,.btn-media{width:40px;height:44px;display:flex;align-items:center;justify-content:center;
    border-radius:12px;flex-shrink:0;transition:all .15s}
  .btn-emoji:hover,.btn-mic:hover,.btn-media:hover{background:var(--panel)}
  .btn-emoji.on{background:rgba(7,193,96,.12);color:var(--acc)}
  .btn-emoji svg,.btn-media svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .btn-mic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .btn-mic.recording{background:var(--unread);color:#fff;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.5}}
  .composer input{flex:1;border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:14px;
    background:var(--bg);color:var(--ink);transition:border-color .2s,box-shadow .2s}
  .composer input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(7,193,96,.1)}
  .btn-send{background:var(--acc);color:#fff;border-radius:12px;padding:0 22px;font-size:14px;font-weight:600;
    height:46px;flex-shrink:0;transition:transform .15s,box-shadow .2s}
  .btn-send:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(7,193,96,.25)}

  #webview{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column}
  .wv-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
  .wv-bar button{color:var(--acc);font-size:13.5px;padding:7px 12px;border-radius:9px}
  .wv-bar button:hover{background:var(--panel)}
  .wv-title{flex:1;text-align:center;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wv-url{font-size:10.5px;color:var(--sub);text-align:center;padding:5px;background:rgba(209,154,30,.06);
    font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wv-hint{font-size:10.5px;color:var(--warn);text-align:center;padding:5px;background:rgba(209,154,30,.06);line-height:1.5}
  #wvFrame{flex:1;width:100%;border:none;background:#fff}

  #imgViewer{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:550;
    display:flex;align-items:center;justify-content:center;cursor:zoom-out}
  #imgViewer img{max-width:92vw;max-height:88vh;border-radius:12px}

  .mask{position:fixed;inset:0;background:rgba(20,25,40,.4);z-index:400;display:flex;
    align-items:center;justify-content:center;padding:20px;animation:maskIn .2s ease}
  html.dark .mask{background:rgba(0,0,0,.6)}
  @keyframes maskIn{from{opacity:0}}
  .modal{background:var(--bg2);border-radius:18px;width:100%;max-width:350px;
    padding:24px;max-height:84vh;overflow-y:auto;box-shadow:var(--shadow-lg);
    animation:modalIn .22s cubic-bezier(.2,.9,.3,1.1)}
  @keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(10px)}}
  .modal h3{font-size:16px;margin-bottom:18px;font-weight:700}
  .req-user{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .req-msg{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:18px}
  .modal-btns{display:flex;gap:10px}
  .mbtn{flex:1;padding:12px;border-radius:11px;font-size:14px;font-weight:600;transition:transform .12s}
  .mbtn:hover{transform:translateY(-1px)}
  .mbtn.gray{background:var(--panel);color:var(--ink)}
  .mbtn.green{background:var(--acc);color:#fff}
  .modal-close{float:right;color:var(--sub);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
  .modal-close:hover{color:var(--ink);background:var(--panel)}
  .fm-info{display:flex;align-items:center;gap:13px;margin-bottom:16px}
  .big-avatar{width:56px;height:56px;border-radius:14px;color:#fff;font-size:21px;font-weight:700;
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
  .fm-item{border-top:1px solid var(--line)}
  .fm-item button{width:100%;text-align:left;padding:13px 6px;font-size:14px;border-radius:6px;
    transition:background .12s;display:flex;align-items:center;gap:10px}
  .fm-item button.danger{color:var(--unread)}

function timeStr(ts){

  var hm = two(d.getHours()) + ':' + two(d.getMinutes());
  if (d.toDateString() === now.toDateString()) return hm;
  return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + hm;
}
function fmtSize(bytes){
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1048576) return (bytes/1024).toFixed(0) + 'KB';
  return (bytes/1048576).toFixed(1) + 'MB';
}
function avatarColor(str){
  var n = 0;
  for (var i = 0; i < str.length; i++) n += str.charCodeAt(i);
  return AV_COLORS[n % AV_COLORS.length];
}
function avatarEl(name, key, small, avatarUrl){
  var el = document.createElement('div');
  el.className = small ? 'm-avatar' : 'avatar sm';

  if (avatarUrl) {
    var img = document.createElement('img');
    img.src = avatarUrl;
    el.appendChild(img);
  } else {
    el.textContent = String(name || '?').charAt(0).toUpperCase();
  }
  return el;
}
function roleLabel(role){

}
function roleClass(role){

}
function openModal(id){ $(id).hidden = false; }
function closeModal(id){ $(id).hidden = true; }
function copyText(text, okMsg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast(okMsg); }
    catch(e) { showToast('复制失败，请手动复制：' + text, true); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ showToast(okMsg); }, fallback);
  } else fallback();
}

var msgSeen = {};
var fwdSeen = {};
function isDupMsg(key, from, ts){
  var sk = from + '|' + ts;
  var s = msgSeen[key];
  if (s && s[sk]) return true;
  if (!s) s = msgSeen[key] = {};
  s[sk] = 1;
  var n = 0, kk;
  for (kk in s) { n++; if (n > 500) delete s[kk]; }
  return false;
}
function isDupFwd(gid, from, ts){
  var sk = from + '|' + ts;
  var s = fwdSeen[gid];
  if (s && s[sk]) return true;
  if (!s) s = fwdSeen[gid] = {};
  s[sk] = 1;
  var n = 0, kk;
  for (kk in s) { n++; if (n > 500) delete s[kk]; }
  return false;
}

function hideCtxMenu(){ $('ctxMenu').hidden = true; }

document.addEventListener('contextmenu', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  e.preventDefault();
}, false);

function showCtxMenu(x, y, items){
  var menu = $('ctxMenu');
  menu.innerHTML = '';
  items.forEach(function(it){
    if (it === '-') {
      var sep = document.createElement('div');
      sep.className = 'ctx-sep';
      menu.appendChild(sep);
      return;
    }
    var d = document.createElement('div');
    d.className = 'ctx-item' + (it.danger ? ' danger' : '');
    d.innerHTML = icHTML(it.icon || '');
    var lb = document.createElement('span');
    lb.textContent = it.label;
    d.appendChild(lb);
    d.onclick = function(ev){
      ev.stopPropagation();
      hideCtxMenu();
      if (it.fn) it.fn();
    };
    menu.appendChild(d);
  });
  menu.hidden = false;
  var mw = menu.offsetWidth, mh = menu.offsetHeight;
  var px = Math.min(x, window.innerWidth - mw - 8);
  var py = Math.min(y, window.innerHeight - mh - 8);
  menu.style.left = Math.max(4, px) + 'px';
  menu.style.top = Math.max(4, py) + 'px';
}

function msgCtxMenu(e, m, isMe, isGroup, g){
  e.preventDefault();
  e.stopPropagation();
  var rec = meRec();
  var items = [];
  if (m.text && !m.recalled) {
    items.push({ icon: 'copy', label: '复制', fn: function(){ copyText(m.text, '已复制'); } });
  }
  if (isMe && !m.recalled && (Date.now() - m.ts < 2 * 60 * 60 * 1000)) {
    items.push('-');
    items.push({ icon: 'recall', label: '撤回', fn: function(){ recallMsg(m); } });
  }
  if (!isMe && isGroup && g && !m.recalled && m.from &&
      (g.owner === myUid || g.myRole === 'admin')) {
    items.push({ icon: 'shield', label: '管理员撤回', danger: true, fn: function(){
      if (!confirm('以管理员身份撤回该成员的消息？')) return;
      var payload = { t: 'recall', uid: myUid, key: currentChat, ts: m.ts };
      deliverOrQueue(m.from, currentChat, payload, 0);
      if (g.owner === myUid) {
        g.members.forEach(function(mm2){
          if (mm2.uid === myUid || mm2.uid === m.from) return;
          deliverOrQueue(mm2.uid, currentChat, payload, 0);
        });
      }
      delete m.text; delete m.img; delete m.audio; delete m.video;
      m.recalled = true;
      saveMe(rec);
      renderMsgs();
    }});
  }
  if (!m.recalled && (m.text || m.img || m.video)) {
    items.push('-');
    items.push({ icon: 'forward', label: '复制内容以便转发', fn: function(){
      if (m.text) copyText(m.text, '内容已复制，粘贴到其他聊天发送');
      else copyText(m.img || m.video, '媒体数据已复制');
    }});
  }
  if (items.length) showCtxMenu(e.clientX, e.clientY, items);
}

var DB_KEY = 'azchat_v5', SES_KEY = 'azchat_session_v5';
function normalizeAccount(rec, name){
  if (!rec || typeof rec !== 'object') return null;
  if (!rec.uid) return null;
  if (!rec.contacts || typeof rec.contacts !== 'object') rec.contacts = {};
  if (!rec.chats || typeof rec.chats !== 'object') rec.chats = {};
  if (!rec.groups || typeof rec.groups !== 'object') rec.groups = {};
  if (!Array.isArray(rec.outbox)) rec.outbox = [];
  if (!Array.isArray(rec.stickers)) rec.stickers = [];
  if (!rec.name) rec.name = name;
  if (rec.avatar === undefined) rec.avatar = '';
  return rec;
}
function loadDB(){
  var db;
  try { db = JSON.parse(storage.getItem(DB_KEY)) || {}; }
  catch(e) { db = {}; }
  var changed = false;
  for (var n in db) {
    var before = JSON.stringify(db[n]);
    db[n] = normalizeAccount(db[n], n);
    if (JSON.stringify(db[n]) !== before) changed = true;
  }
  if (changed) {
    try { storage.setItem(DB_KEY, JSON.stringify(db)); } catch(e) {}
  }
  return db;
}
function saveDB(d){ storage.setItem(DB_KEY, JSON.stringify(d)); }
function meRec(){ return loadDB()[me]; }
function saveMe(rec){ var d = loadDB(); d[me] = rec; saveDB(d); }
function findNameByUid(uid){
  var db = loadDB();
  for (var n in db) { if (db[n].uid === uid) return n; }
  return null;
}
function isGroupKey(key){
  var rec = meRec();
  return !!(rec && rec.groups && rec.groups[key]);
}

/* ═══════════ 云端（Supabase） ═══════════ */
var cloudReady = false, cloudFetching = false;
var seenCloudIds = {};
var sbClient = null;

function cloudConfigured(){
  return SB_URL && SB_KEY &&
         SB_URL.indexOf('填入') === -1 && SB_KEY.indexOf('填入') === -1;
}
function initCloud(cb){
  if (!cloudConfigured()) { cb(false); return; }
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
  s.onload = function(){
    try {
      sbClient = supabase.createClient(SB_URL, SB_KEY);
      cloudReady = true;
      try {
        cloudChannel = sbClient
          .channel('az_mail_' + myUid)
          .on('postgres_changes',
              { event: 'INSERT', schema: 'public', table: SB_TABLE, filter: 'to_uid=eq.' + myUid },
              function(){ cloudFetch(); })
          .subscribe();
      } catch(e) {}
      cb(true);
    } catch(e) { cb(false); }
  };
  s.onerror = function(){ cb(false); };
  document.head.appendChild(s);
}
function cloudSend(toUid, payload, key, ts, onFail){
  if (!sbClient) { if (onFail) onFail(); return; }
  sbClient.from(SB_TABLE)
    .insert([{ to_uid: toUid, body: payload }])
    .then(function(res){
      if (res.error) { if (onFail) onFail(); return; }
      markSent(key, ts);
    });
}
function cloudFetch(){
  if (!sbClient || !me || cloudFetching) return;
  cloudFetching = true;
  sbClient.from(SB_TABLE)
    .select('*')
    .eq('to_uid', myUid)
    .order('created_at', { ascending: true })
    .limit(50)
    .then(function(res){
      cloudFetching = false;
      if (res.error || !res.data || !res.data.length) return;
      var fresh = [];
      res.data.forEach(function(row){
        if (seenCloudIds[row.id]) return;
        seenCloudIds[row.id] = true;
        fresh.push(row);
      });
      if (!fresh.length) return;
      var ids = fresh.map(function(r){ return r.id; });
      sbClient.from(SB_TABLE).delete().in('id', ids).then(function(){});
      var count = 0;
      fresh.forEach(function(row){
        try {
          handleData(dummyConn, row.body);
          count++;
        } catch(e) {}
      });
      if (count > 0) showToast('已收到 ' + count + ' 条消息（云端）');
      flushOutbox();
    });
}
function cloudRegister(rec, cb){
  if (!sbClient) { cb('云端未连接'); return; }
  sbClient.from(SB_USERS)
    .upsert([{ uid: rec.uid, name: rec.name, salt: rec.salt, hash: rec.hash, avatar: rec.avatar || '' }],
            { onConflict: 'uid' })
    .then(function(res){ cb(res.error ? res.error.message : null); });
}
function cloudLogin(uid, pass, cb){
  if (!sbClient) { cb('云端未连接', null); return; }
  sbClient.from(SB_USERS).select('*').eq('uid', uid).maybeSingle()
    .then(function(res){
      if (res.error) { cb(res.error.message, null); return; }
      if (!res.data) { cb('notfound', null); return; }
      var row = res.data;
      if (sha256(row.salt + pass) !== row.hash) { cb('密码错误', null); return; }
      cb(null, {
        uid: row.uid, name: row.name || uid, avatar: row.avatar || '',
        contacts: row.contacts || {}, groups: row.groups || {}, chats: row.chats || {},
        stickers: row.stickers || [], outbox: [], salt: row.salt, hash: row.hash
      });
    });
}
function cloudUpdateProfile(rec, cb){
  if (!sbClient) { if (cb) cb('云端未连接'); return; }
  sbClient.from(SB_USERS)
    .update({ name: rec.name, avatar: rec.avatar || '' })
    .eq('uid', rec.uid)
    .then(function(res){ if (cb) cb(res.error ? res.error.message : null); });
}

function setMode(r){

}
 $('tabLogin').onclick = function(){ setMode(false); };
 $('tabReg').onclick = function(){ setMode(true); };

 $('fUid').oninput = function(e){
  var v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (v.slice(0,2) === 'AZ') v = v.slice(2);
  v = v.slice(0, 8);
  e.target.value = v ? 'AZ' + v : '';
};

 $('authForm').onsubmit = function(e){
  e.preventDefault();
  if (authBusy) return;
  try {
    var err = $('formErr');
    var pass = $('fPass').value;
    if (pass.length < 6) { err.textContent = '密码至少 6 位'; return; }
    var db = loadDB();

    if (regMode) {
      var name = $('fUser').value.replace(/^\s+|\s+$/g, '');
      if (name.length < 2) { err.textContent = '昵称至少 2 个字符'; return; }
      if ($('fPass2').value !== pass) { err.textContent = '两次输入的密码不一致'; return; }
      if (db[name]) { err.textContent = '该昵称已被注册（本机）'; return; }
      authBusy = true;
      $('authSubmit').disabled = true;
      $('authSubmit').textContent = '注册中…';
      var salt = randHex(8);
      var uid = 'AZ' + sha256('azchat-id::' + name + salt).slice(0, 8).toUpperCase();
      var rec = { salt: salt, hash: sha256(salt + pass), uid: uid, name: name, avatar: '',
                  contacts: {}, chats: {}, stickers: [], groups: {}, outbox: [] };
      db[name] = rec;
      saveDB(db);
      var finishReg = function(){
        authBusy = false;
        $('authSubmit').disabled = false;
        $('authSubmit').textContent = '注册并获取 ID';
        showToast('注册成功！你的 ID：' + uid);
        enterApp(name);
      };
      initCloud(function(ok){
        if (!ok) {
          showToast('注意：云端不可用，账号仅保存在本机', true);
          finishReg();
          return;
        }
        cloudRegister(rec, function(cerr){
          if (cerr) showToast('云端注册失败：' + cerr, true);
          else showToast('已同步云端，任何设备凭 ID+密码可登录');
          finishReg();
        });
      });
    } else {
      var m = $('fUid').value.match(/^AZ([0-9A-Z]{8})$/);
      if (!m) { err.textContent = '请输入完整的 ID，格式为 AZ + 8 位字符'; return; }
      var loginUid = 'AZ' + m[1];
      authBusy = true;
      $('authSubmit').disabled = true;
      $('authSubmit').textContent = '登录中…';
      var done = function(){
        authBusy = false;
        $('authSubmit').disabled = false;
        $('authSubmit').textContent = '进入';
      };
      var localName = findNameByUid(loginUid);

      if (localName) {
        var r2 = db[localName];
        if (sha256(r2.salt + pass) !== r2.hash) {
          done();
          err.textContent = '密码错误'; return;
        }
        if ($('fRemember').checked) {
          var enc = encPass(pass);
          if (enc) { r2.remembered = true; r2.encPass = enc; }
          var d2 = loadDB(); d2[localName] = r2; saveDB(d2);
        }
        initCloud(function(ok){
          if (ok) {
            sbClient.from(SB_USERS).select('name,avatar').eq('uid', loginUid).maybeSingle()
              .then(function(res){
                if (!res.error && res.data) {
                  var r3 = loadDB()[localName];
                  var upd = false;
                  if (res.data.name && res.data.name !== r3.name) { r3.name = res.data.name; upd = true; }
                  if (res.data.avatar && res.data.avatar !== r3.avatar) { r3.avatar = res.data.avatar; upd = true; }
                  if (upd) { var dd = loadDB(); dd[localName] = r3; saveDB(dd); }
                }
                done();
                enterApp(localName);
                showToast('欢迎回来，' + (loadDB()[localName].name || localName));
              });
          } else {
            done();
            enterApp(localName);
            showToast('欢迎回来，' + (r2.name || localName));
          }
        });
      } else {
        initCloud(function(ok){
          if (!ok) {
            done();
            err.textContent = '该 ID 未在本机注册过，且云端不可用'; return;
          }
          cloudLogin(loginUid, pass, function(cerr, acct){
            if (cerr) {
              done();
              if (cerr === 'notfound') err.textContent = '该 ID 在本机和云端都不存在，请先注册';
              else err.textContent = '云端查询失败：' + cerr;
              return;
            }
            var baseName = acct.name || loginUid;
            var localKey = baseName;
            var nn = 2;
            while (db[localKey]) { localKey = baseName + '_' + nn; nn++; }
            acct.name = localKey;
            var cur = loadDB();
            cur[localKey] = acct;
            saveDB(cur);
            if ($('fRemember').checked) {
              var enc2 = encPass(pass);
              if (enc2) { acct.remembered = true; acct.encPass = enc2; }
              var cur2 = loadDB(); cur2[localKey] = acct; saveDB(cur2);
            }
            done();
            enterApp(localKey);
            showToast('已从云端找回账号');
          });
        });
      }
    }
  } catch(ex) {
    authBusy = false;
    $('authSubmit').disabled = false;
    $('formErr').textContent = '出错了：' + ex.message;
  }
};

function refreshMyIdentity(){

function enterApp(name){
  me = name;
  var rec = meRec();
  if (!rec) { showToast('账号数据异常，请重新登录', true); return; }
  myUid = rec.uid;
  try { storage.setItem(SES_KEY, name); } catch(e) {}
  refreshMyIdentity();
  $('authView').hidden = true;
  $('appView').hidden = false;
  unread = {}; currentChat = null; chatType = 'friend'; conns = {};
  showEmptyChat();
  renderContacts();
  renderStickerGrid();
  setNet('off');
  var afterCloud = function(){
    cloudFetch();
    if (cloudTimer) clearInterval(cloudTimer);
    cloudTimer = setInterval(cloudFetch, 10000);
    if (meRec() && !meRec()._cloudSynced) {
      cloudRegister(meRec(), function(cerr){
        var r = meRec();
        if (!cerr) { r._cloudSynced = true; saveMe(r); }
      });
    }
  };
  if (cloudReady) afterCloud();
  else {
    initCloud(function(ok){
      if (ok) afterCloud();
      else if (cloudConfigured()) showToast('云端连接失败，将仅本机运行', true);
    });
  }
  ensurePeerJS(function(ok){
    if (!ok) { setNet('err'); showToast('无法加载 P2P 组件（PeerJS）', true); return; }
    startPeer();
  });
  if (flushTimer) clearInterval(flushTimer);
  flushTimer = setInterval(flushOutbox, 20000);
  setTimeout(flushOutbox, 5000);
}

/* ═══════════ PeerJS ═══════════ */
var PEER_CDNS = [
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
];
function ensurePeerJS(cb){
  if (typeof Peer !== 'undefined') { cb(true); return; }
  var idx = 0;
  function tryNext(){
    if (idx >= PEER_CDNS.length) { cb(false); return; }
    var s = document.createElement('script');
    s.src = PEER_CDNS[idx++];
    s.onload = function(){ cb(typeof Peer !== 'undefined'); };
    s.onerror = function(){ tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
}

function setNet(state){
  var el = $('netStatus');
  if (!el) return;
  var cloudTag = cloudReady ? ' · 云端信箱已启用' : '';
  if (state === 'on') {
    el.innerHTML = '<span style="color:var(--green)">● 已连接</span>' + cloudTag;
  } else if (state === 'err') {
    el.innerHTML = '<span style="color:var(--unread)">● P2P 受限</span>' +
      (cloudReady ? '，云端消息仍可收发' : '，请换网络重试');
  } else {
    el.innerHTML = '<span style="color:var(--warn)">● 正在连接…</span>' + cloudTag;
  }
}

function peerIdOf(uid){ return 'azchat-u-' + uid.toLowerCase(); }
function peerOpts(){
  return {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
        { urls: 'stun:stun.miwifi.com:3478' },
        { urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp',
          username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:80?transport=tcp',
          username: 'openrelayproject', credential: 'openrelayproject' }
      ],
      iceCandidatePoolSize: 10
    }
  };
}
function startPeer(){
  if (peer) { try { peer.destroy(); } catch(e) {} peer = null; }
  setNet('off');
  var opened = false;
  peer = new Peer(peerIdOf(myUid), peerOpts());
  setTimeout(function(){
    if (!opened) { setNet('err'); }
  }, 12000);
  peer.on('open', function(){
    opened = true;
    setNet('on');
    updateChatStatus();
    cloudFetch();
  });
  peer.on('connection', bindIncoming);
  peer.on('disconnected', function(){
    setNet('off');
    try { peer.reconnect(); } catch(e) {}
  });
  peer.on('error', function(e){
    var t = e && e.type;
    if (t === 'unavailable-id') {
      showToast('该账号已在其他窗口登录，本窗口以临时身份运行', true);
      peer = new Peer(peerIdOf(myUid) + '-' + randHex(2), peerOpts());
      peer.on('connection', bindIncoming);
      peer.on('disconnected', function(){ try { peer.reconnect(); } catch(e2) {} });
    } else if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') {
      setNet('err');
      setTimeout(function(){
        if (peer && !peer.open && me) { try { peer.reconnect(); } catch(e2) {} }
      }, 30000);
    }
  });
}

/* ═══════════ 统一投递 ═══════════ */
function queueLocal(toUid, key, payload, msgTs){
  var rec = meRec();
  if (!rec) return;
  rec.outbox.push({ to: toUid, key: key, payload: payload, ts: msgTs || Date.now() });
  if (rec.outbox.length > 200) rec.outbox = rec.outbox.slice(-200);
  saveMe(rec);
}
function deliverOrQueue(toUid, key, payload, msgTs, _retried){
  ensureConn(toUid, function(c){
    try { c.send(payload); } catch(e) {}
    markSent(key, msgTs);
  }, function(){
    if (!_retried) {
      setTimeout(function(){
        if (!me) return;
        delete conns[toUid];
        deliverOrQueue(toUid, key, payload, msgTs, true);
      }, 3000);
      return;
    }
    if (cloudReady) {
      cloudSend(toUid, payload, key, msgTs, function(){
        queueLocal(toUid, key, payload, msgTs);
      });
    } else {
      queueLocal(toUid, key, payload, msgTs);
    }
  });
}
function markSent(key, ts){
  if (!ts) return;
  var rec = meRec();
  if (!rec) return;
  var arr = rec.chats[key];
  if (!arr) return;
  var hit = false;
  for (var i = 0; i < arr.length; i++) {
    if (arr[i].ts === ts && arr[i].pending) { arr[i].pending = false; hit = true; }
  }
  if (hit) { saveMe(rec); if (currentChat === key) renderMsgs(); }
}
function flushOutbox(){
  if (!me || !peer || !peer.open) return;
  var rec = meRec();
  if (!rec || !rec.outbox || !rec.outbox.length) return;
  var byTarget = {};
  rec.outbox.forEach(function(item){
    if (!byTarget[item.to]) byTarget[item.to] = [];
    byTarget[item.to].push(item);
  });
  for (var to in byTarget) {
    (function(to){
      ensureConn(to, function(c){
        var items = byTarget[to];
        items.forEach(function(item){
          try {
            c.send(item.payload);
            markSent(item.key, item.ts);
          } catch(e) {}
        });
        var sentSet = {};
        items.forEach(function(item){ sentSet[item.ts] = true; });
        var rec2 = meRec();
        rec2.outbox = rec2.outbox.filter(function(o){
          return !(o.to === to && sentSet[o.ts]);
        });
        saveMe(rec2);
        showToast('离线消息已送达');
      }, null);
    })(to);
  }
}

function bindIncoming(c){
  c.on('data', function(d){
    try { handleData(c, d); }
    catch(e) { showToast('处理消息出错：' + e.message, true); }
  });
  c.on('close', function(){
    for (var u in conns) { if (conns[u] === c) delete conns[u]; }
    updateChatStatus();
  });
}

function handleData(c, d){
  if (!d || typeof d !== 'object' || !d.uid) return;
  var uid = String(d.uid);
  var rec = meRec();
  if (!rec) return;

  if (d.t === 'add') { handleAddReq(c, uid, d.name, d.avatar); return; }

  if (d.t === 'read') {
    var rk = d.key;
    if (!rec.chats[rk]) return;
    var lastTs = d.ts || Date.now();
    var ch = false;
    for (var ri = 0; ri < rec.chats[rk].length; ri++) {
      var rm = rec.chats[rk][ri];
      if (rm.w === 'me' && rm.ts <= lastTs && !rm.readBy) { rm.readBy = [uid]; ch = true; }
    }
    if (ch) { saveMe(rec); if (currentChat === rk) renderMsgs(); }
    return;
  }

  if (d.t === 'recall') {
    if (isDupMsg('__recall', uid + '|' + d.key, d.ts)) return;
    var rkey = d.key, rts = d.ts;
    if (rec.chats[rkey]) {
      for (var ci = 0; ci < rec.chats[rkey].length; ci++) {
        var cm = rec.chats[rkey][ci];
        if (cm.ts === rts && cm.w === 'them') {
          delete cm.text; delete cm.img; delete cm.audio; delete cm.video;
          cm.recalled = true;
          saveMe(rec);
          if (currentChat === rkey) renderMsgs();
          showToast(displayName(rec, uid, cm.fromName) + ' 撤回了一条消息');
          break;
        }
      }
    }
    return;
  }

  if (d.t === 'gannounce') {
    var ga = rec.groups[d.gid];
    if (ga) {
      ga.announce = d.text || '';
      ga.announceBy = d.annName || '';
      ga.announceTs = Date.now();
      saveMe(rec);
      showToast('群公告已更新：' + String(d.text||'').slice(0,20));
      if (currentChat === d.gid) renderMsgs();
    }
    return;
  }

  if (d.t === 'gmention') {
    var gm1 = rec.groups[d.gid];
    if (!gm1) return;
    showToast(displayName(rec, uid, d.name) + ' 在「' + gm1.name + '」中@了你' +
              (d.all ? '（@所有人）' : ''), true);
    return;
  }

  if (d.t === 'profile') {
    var changed = false;
    if (rec.contacts[uid]) {
      if (d.name) { rec.contacts[uid].name = String(d.name).slice(0,16); changed = true; }
      if (typeof d.avatar === 'string') { rec.contacts[uid].avatar = d.avatar; changed = true; }
    }
    for (var gid in rec.groups) {
      var g = rec.groups[gid];
      if (g.owner !== myUid) continue;
      for (var i = 0; i < g.members.length; i++) {
        if (g.members[i].uid === uid) {
          if (d.name) g.members[i].name = String(d.name).slice(0,16);
          if (typeof d.avatar === 'string') g.members[i].avatar = d.avatar;
          changed = true;
        }
      }
    }
    if (changed) {
      saveMe(rec);
      renderContacts();
      if (currentChat) renderMsgs();
      for (var gid2 in rec.groups) {
        if (rec.groups[gid2].owner === myUid) gsyncGroup(gid2);
      }
    }
    return;
  }

  if (d.t === 'gmsg') {
    var g1 = rec.groups[d.gid];
    if (!g1) return;
    var senderIn = false;
    for (var j = 0; j < g1.members.length; j++) {
      if (g1.members[j].uid === uid) { senderIn = true; break; }
    }
    if (!senderIn) return;
    if (isDupMsg(d.gid, uid, d.ts)) return;
    if (typeof d.video === 'string' && d.video.indexOf('data:video/') === 0 && d.video.length <= VIDEO_MAX) {
      receiveMsg(d.gid, { w:'them', from:uid, fromName:String(d.name||uid).slice(0,16), video:d.video, vsize:d.vsize||0, mentions:d.mentions||[], ts:d.ts||Date.now() });
    } else if (typeof d.audio === 'string' && d.audio.indexOf('data:audio/') === 0 && d.audio.length <= 1200000) {
      receiveMsg(d.gid, { w:'them', from:uid, fromName:String(d.name||uid).slice(0,16), audio:d.audio, dur:d.dur||0, mentions:d.mentions||[], ts:d.ts||Date.now() });
    } else if (typeof d.text === 'string') {
      receiveMsg(d.gid, { w:'them', from:uid, fromName:String(d.name||uid).slice(0,16), text:String(d.text).slice(0,2000), mentions:d.mentions||[], ts:d.ts||Date.now() });
    } else if (typeof d.img === 'string' && d.img.indexOf('data:image/') === 0 && d.img.length <= 500000) {
      receiveMsg(d.gid, { w:'them', from:uid, fromName:String(d.name||uid).slice(0,16), img:d.img, mentions:d.mentions||[], ts:d.ts||Date.now() });
    }
    if (g1.owner === myUid && uid !== myUid) {
      if (!isDupFwd(d.gid, uid, d.ts)) {
        g1.members.forEach(function(m){
          if (m.uid === uid || m.uid === myUid) return;
          deliverOrQueue(m.uid, d.gid, { t:'gmsg', uid:uid, name:d.name, text:d.text, img:d.img, audio:d.audio, video:d.video, vsize:d.vsize, dur:d.dur, mentions:d.mentions, gid:d.gid, ts:d.ts }, 0);
        });
      }
    }
    return;
  }

  if (d.t === 'gsync') {
    if (!d.group || !d.group.gid) return;
    var gNew = d.group;
    var meIn = false, myRole = 'member';
    for (var k = 0; k < gNew.members.length; k++) {
      if (gNew.members[k].uid === myUid) { meIn = true; myRole = gNew.members[k].role; break; }
    }
    if (!meIn) {
      if (rec.groups[gNew.gid]) {
        delete rec.groups[gNew.gid];
        delete rec.chats[gNew.gid];
        saveMe(rec);
        if (currentChat === gNew.gid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
        renderContacts();
        showToast('你已被移出群聊「' + gNew.name + '」', true);
      }
      return;
    }
    gNew.myRole = myRole;
    rec.groups[gNew.gid] = gNew;
    saveMe(rec);
    renderContacts();
    if (currentChat === gNew.gid) {
      $('chName').textContent = gNew.name;
      $('chUid').textContent = '群聊 · ' + gNew.members.length + ' 位成员';
      updateChatStatus();
    }
    return;
  }

  if (d.t === 'ginvite') {
    if (c === dummyConn) return;
    if (!d.group || rec.groups[d.group.gid]) return;
    reqQueue.push({ type:'ginvite', c:c, group:d.group, fromName:String(d.name||'').slice(0,16) });
    nextReq();
    return;
  }

  if (d.t === 'gkick') {
    var g2 = rec.groups[d.gid];
    if (g2) {
      delete rec.groups[d.gid];
      delete rec.chats[d.gid];
      saveMe(rec);
      if (currentChat === d.gid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
      renderContacts();
      showToast('你已被移出群聊「' + g2.name + '」', true);
    }
    if (c !== dummyConn) { try { c.close(); } catch(e2) {} }
    return;
  }

  if (d.t === 'gkickreq') {
    var g3 = rec.groups[d.gid];
    if (!g3 || g3.owner !== myUid) return;
    removeGroupMember(d.gid, uid, '管理员移出');
    return;
  }

  if (d.t === 'gleave') {
    var g4 = rec.groups[d.gid];
    if (!g4 || g4.owner !== myUid) return;
    var leaverName = '';
    for (var li = 0; li < g4.members.length; li++) {
      if (g4.members[li].uid === uid) { leaverName = g4.members[li].name; break; }
    }
    removeGroupMember(d.gid, uid, '退出群聊');
    receiveMsg(d.gid, { w:'them', from:'sys', sysText:(leaverName||'有人') + ' 退出了群聊', ts:Date.now() });
    if (c !== dummyConn) { try { c.close(); } catch(e2) {} }
    return;
  }

  if (d.t === 'grole') {
    var g5 = rec.groups[d.gid];
    if (g5) {
      g5.myRole = d.role;
      for (var k2 = 0; k2 < g5.members.length; k2++) {
        if (g5.members[k2].uid === myUid) g5.members[k2].role = d.role;
      }
      saveMe(rec);
      showToast('你在群「' + g5.name + '」中的身份变更为：' + roleLabel(d.role));
    }
    return;
  }

  if (d.t === 'gdisband') {
    var g6 = rec.groups[d.gid];
    if (g6) {
      delete rec.groups[d.gid];
      delete rec.chats[d.gid];
      saveMe(rec);
      if (currentChat === d.gid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
      renderContacts();
      showToast('群聊「' + g6.name + '」已被群主解散', true);
    }
    if (c !== dummyConn) { try { c.close(); } catch(e2) {} }
    return;
  }

  if (d.t === 'del') {
    if (rec.contacts[uid]) {
      var nm = displayName(rec, uid, rec.contacts[uid].name);
      delete rec.contacts[uid];
      delete rec.chats[uid];
      saveMe(rec);
      if (currentChat === uid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
      renderContacts();
      showToast(nm + ' 已将你从好友列表移除', true);
    }
    if (c !== dummyConn) { try { c.close(); } catch(e2) {} }
    return;
  }

  if (!rec.contacts[uid]) return;
  if (c !== dummyConn && !conns[uid]) { conns[uid] = c; updateChatStatus(); }
  if (d.t === 'chat' && typeof d.text === 'string') {
    if (isDupMsg(uid, uid, d.ts)) return;
    receiveMsg(uid, { w:'them', text:String(d.text).slice(0,2000), ts:d.ts||Date.now() });
  } else if (d.t === 'sticker' && typeof d.img === 'string' && d.img.indexOf('data:image/') === 0) {
    if (d.img.length > 500000) return;
    if (isDupMsg(uid, uid, d.ts)) return;
    receiveMsg(uid, { w:'them', img:d.img, ts:d.ts||Date.now() });
  } else if (d.t === 'audio' && typeof d.audio === 'string' && d.audio.indexOf('data:audio/') === 0) {
    if (d.audio.length > 1200000) return;
    if (isDupMsg(uid, uid, d.ts)) return;
    receiveMsg(uid, { w:'them', audio:d.audio, dur:d.dur||0, ts:d.ts||Date.now() });
  } else if (d.t === 'video' && typeof d.video === 'string' && d.video.indexOf('data:video/') === 0) {
    if (d.video.length > VIDEO_MAX) return;
    if (isDupMsg(uid, uid, d.ts)) return;
    receiveMsg(uid, { w:'them', video:d.video, vsize:d.vsize||0, ts:d.ts||Date.now() });
  }
}

 $('addInput').oninput = function(e){

 $('btnDoAdd').onclick = function(){

function sendAddReq(uid){
  showToast('正在寻找对方…（最多等 15 秒）');
  var c = peer.connect(peerIdOf(uid), { reliable: true });
  var done = false;
  function finish(){
    if (done) return;
    done = true;
    try { c.close(); } catch(e) {}
  }
  var timer = setTimeout(function(){
    if (!done) {
      showToast('对方不在线或 ID 不存在。加好友需双方同时在线', true);
      finish();
    }
  }, 15000);
  c.on('open', function(){
    var rec = meRec();
    c.send({ t: 'add', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' });
  });
  c.on('data', function(d){
    clearTimeout(timer); finish();
    if (d && d.t === 'addok') {
      var rec = meRec();
      rec.contacts[uid] = { uid: uid, name: String(d.name || uid).slice(0, 16), avatar: d.avatar || '', remark: '' };
      saveMe(rec);
      renderContacts();
      showToast('已添加 ' + rec.contacts[uid].name);
    } else {
      showToast('对方拒绝了你的好友请求', true);
    }
  });
  c.on('error', function(){
    clearTimeout(timer);
    if (!done) { showToast('连接失败，请稍后重试', true); finish(); }
  });
}

var reqQueue = [], reqShowing = false;
function handleAddReq(c, uid, name, avatar){
  var rec = meRec();
  if (c === dummyConn) return;
  if (rec.contacts[uid]) {
    try { c.send({ t: 'addok', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' }); } catch(e) {}
    return;
  }
  reqQueue.push({ type:'add', c:c, uid:uid, name:String(name || uid).slice(0, 16), avatar: avatar || '' });
  nextReq();
}
function nextReq(){
  if (reqShowing || !reqQueue.length) return;
  reqShowing = true;
  var r = reqQueue.shift();

  if (r.type === 'ginvite') {
    $('girText').textContent = '「' + r.fromName + '」邀请你加入群聊「' + r.group.name + '」（' + r.group.members.length + ' 人）。';
    openModal('gInviteReqModal');
    $('girAccept').onclick = function(){
      closeModal('gInviteReqModal');
      var rec = meRec();
      var myRole = 'member';
      for (var i = 0; i < r.group.members.length; i++) {
        if (r.group.members[i].uid === myUid) myRole = r.group.members[i].role;
      }
      r.group.myRole = myRole;
      rec.groups[r.group.gid] = r.group;
      rec.chats[r.group.gid] = rec.chats[r.group.gid] || [];
      saveMe(rec);
      renderContacts();
      try { r.c.send({ t: 'gack', uid: myUid, name: rec.name || me, gid: r.group.gid, avatar: rec.avatar || '' }); } catch(e) {}
      showToast('已加入群聊「' + r.group.name + '」');
      reqShowing = false;
      nextReq();
    };
    $('girReject').onclick = function(){
      closeModal('gInviteReqModal');
      reqShowing = false;
      nextReq();
    };
    return;
  }

  $('reqName').textContent = r.name;
  $('reqUid').textContent = r.uid;
  $('reqText').textContent = '「' + r.name + '」请求添加你为好友。';
  var av = $('reqAvatar');
  av.innerHTML = '';
  av.style.background = avatarColor(r.uid);
  if (r.avatar) {
    var img = document.createElement('img');
    img.src = r.avatar;
    av.appendChild(img);
  } else {
    av.textContent = r.name.charAt(0).toUpperCase();
  }
  openModal('reqModal');
  $('btnAccept').onclick = function(){
    closeModal('reqModal');
    var rec = meRec();
    rec.contacts[r.uid] = { uid: r.uid, name: r.name, avatar: r.avatar || '', remark: '' };
    saveMe(rec);
    renderContacts();
    try { r.c.send({ t: 'addok', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' }); } catch(e) {}
    conns[r.uid] = r.c;
    updateChatStatus();
    showToast('已添加 ' + r.name);
    reqShowing = false;
    nextReq();
  };
  $('btnReject').onclick = function(){
    closeModal('reqModal');
    try { r.c.send({ t: 'addno', uid: myUid }); r.c.close(); } catch(e) {}
    reqShowing = false;
    nextReq();
  };
}

var inviteGid = null;
 $('btnGroupInvite').onclick = function(){
  if (!currentChat || !isGroupKey(currentChat)) return;
  var g = meRec().groups[currentChat];
  if (g.owner !== myUid) { showToast('只有群主可以邀请好友进群', true); return; }

  var any = false;
  for (var uid in rec.contacts) {

      if (g.members[i].uid === uid) { already = true; break; }
    }

    any = true;

 $('btnDoInvite').onclick = function(){
  if (!inviteGid) return;
  var rec = meRec();
  var g = rec.groups[inviteGid];
  if (!g) return;
  var picked = [];
  var boxes = $('giList').querySelectorAll('input[type=checkbox]:checked');
  for (var i = 0; i < boxes.length; i++) picked.push(boxes[i].value);
  if (!picked.length) { $('giErr').textContent = '请先勾选好友'; return; }
  closeModal('groupInviteModal');
  var invited = 0, failed = 0;
  picked.forEach(function(uid){
    var c = peer.connect(peerIdOf(uid), { reliable: true });
    var done = false;
    function finish(){ if (!done) { done = true; try { c.close(); } catch(e) {} } }
    function checkDone(){
      if (invited + failed === picked.length) {
        showToast('邀请完成：成功 ' + invited + ' 人' + (failed ? ('，' + failed + ' 人不在线未收到') : ''));
      }
    }
    var timer = setTimeout(function(){
      if (!done) { failed++; finish(); checkDone(); }
    }, 15000);
    c.on('open', function(){
      var snapshot = JSON.parse(JSON.stringify(g));
      c.send({ t: 'ginvite', uid: myUid, name: rec.name || me, group: snapshot });
    });
    c.on('data', function(d){
      clearTimeout(timer); finish();
      if (d && d.t === 'gack' && d.gid === inviteGid) {
        g.members.push({ uid: uid, name: String(d.name||uid).slice(0,16), role: 'member', avatar: d.avatar || '' });
        saveMe(rec);
        gsyncGroup(inviteGid);
        renderContacts();
        invited++;
      } else {
        failed++;
      }
      checkDone();
    });
    c.on('error', function(){ clearTimeout(timer); if (!done) { failed++; finish(); checkDone(); } });
  });
};

function gsyncGroup(gid){
  var rec = meRec();
  var g = rec.groups[gid];
  if (!g || g.owner !== myUid) return;
  var snapshot = JSON.parse(JSON.stringify(g));
  g.members.forEach(function(m){
    if (m.uid === myUid) return;
    deliverOrQueue(m.uid, gid, { t: 'gsync', uid: myUid, group: snapshot }, 0);
  });
}
function removeGroupMember(gid, uid, reason){
  var rec = meRec();
  var g = rec.groups[gid];
  if (!g || g.owner !== myUid) return;
  g.members = g.members.filter(function(m){ return m.uid !== uid; });
  saveMe(rec);
  var kickPayload = { t: 'gkick', uid: myUid, gid: gid };
  ensureConn(uid, function(c){ try { c.send(kickPayload); } catch(e) {} setTimeout(function(){ try { c.close(); } catch(e2) {} }, 500); }, function(){
    deliverOrQueue(uid, gid, kickPayload, 0);
  });
  gsyncGroup(gid);
  renderContacts();
  showToast('已将成员移出（' + reason + '）');
}

/* ═══════════ 列表 ═══════════ */
function lastTs(rec, key){
  var ch = rec.chats[key];
  if (!ch || !ch.length) return 0;
  return ch[ch.length - 1].ts || 0;
}
function renderContacts(){
  var box = $('contactList');
  box.innerHTML = '';
  var rec = meRec();
  if (!rec) return;
  var items = [];
  for (var uid in rec.contacts) items.push({ type:'friend', key:uid, name:displayName(rec, uid, rec.contacts[uid].name), avatar:rec.contacts[uid].avatar, sub:uid });
  for (var gid in rec.groups) items.push({ type:'group', key:gid, name:rec.groups[gid].name, avatar:'', sub:rec.groups[gid].members.length + '人' });
  items.sort(function(a, b){ return lastTs(rec, b.key) - lastTs(rec, a.key); });

  if (!items.length) {
    var empty = document.createElement('div');
    empty.className = 'c-empty';
    empty.innerHTML = '还没有好友和群聊<br>用上方「好友」「群聊」开始<br><span style="opacity:.6">加好友需双方同时在线</span>';
    box.appendChild(empty);
    return;
  }
  items.forEach(function(it){
    var item = document.createElement('div');
    item.className = 'c-item' + (currentChat === it.key ? ' on' : '');
    if (it.type === 'group') {
      var gav = document.createElement('div');
      gav.className = 'avatar sm';
      gav.style.background = 'var(--acc)';

function buildBubbleContent(bub, m, isMe){
  if (m.recalled) {
    bub.className = 'm-bubble m-recalled';
    bub.textContent = isMe ? '你撤回了一条消息' : '对方撤回了一条消息';
    return;
  }
  if (m.audio) {
    bub.className += ' has-audio';
    bub.appendChild(buildAudioEl(m, isMe));
    return;
  }
  if (m.video) {
    bub.className += ' has-media';
    bub.appendChild(buildVideoEl(m, isMe));
    return;
  }
  if (m.img) {
    bub.className += ' has-media';
    var img = document.createElement('img');
    img.src = m.img;
    img.alt = '贴图';
    img.onclick = function(e){
      e.stopPropagation();
      $('imgViewerSrc').src = m.img;
      $('imgViewer').hidden = false;
    };
    bub.appendChild(img);
    return;
  }
  var text = m.text || '';
  var MN_RE = /\[\[mn:([A-Z0-9]*):([^\]]*)\]\]/g;
  var lastIdx = 0, mm;
  var parts = [];
  while ((mm = MN_RE.exec(text)) !== null) {
    if (mm.index > lastIdx) parts.push({ plain: text.slice(lastIdx, mm.index) });
    parts.push({ mention: mm[2] });
    lastIdx = mm.index + mm[0].length;
  }
  if (lastIdx < text.length) parts.push({ plain: text.slice(lastIdx) });
  if (!parts.length) parts.push({ plain: text });
  parts.forEach(function(p){
    if (p.mention) {
      var sp = document.createElement('span');
      sp.className = 'm-mention';
      sp.textContent = '@' + p.mention;
      bub.appendChild(sp);
      return;
    }
    var seg = p.plain;
    var urlParts = seg.split(URL_RE);
    for (var i = 0; i < urlParts.length; i++) {
      if (!urlParts[i]) continue;
      if (i % 2 === 1) {
        var a = document.createElement('a');
        a.className = 'm-link';
        a.textContent = urlParts[i];
        var href = /^https?:\/\//i.test(urlParts[i]) ? urlParts[i] : ('http://' + urlParts[i]);
        a.onclick = (function(url){ return function(e){
          e.preventDefault();
          openWebview(url);
        }; })(href);
        bub.appendChild(a);
      } else {
        bub.appendChild(document.createTextNode(urlParts[i]));
      }
    }
  });
}

/* 视频播放元素：封面 + 播放按钮 + 时长/大小角标，点击全屏播放 */

    }
  };
  return wrap;

function recallMsg(m){
  if (!currentChat) return;
  if (!confirm('撤回这条消息？（双方都会删除）')) return;
  var rec = meRec();
  var key = currentChat;
  var payload = { t: 'recall', uid: myUid, key: key, ts: m.ts };
  if (chatType === 'friend') {
    deliverOrQueue(key, key, payload, 0);
  } else {
    var g = rec.groups[key];
    if (!g) return;
    if (g.owner === myUid) {
      g.members.forEach(function(mm){
        if (mm.uid === myUid) return;
        deliverOrQueue(mm.uid, key, payload, 0);
      });
    } else {
      deliverOrQueue(g.owner, key, payload, 0);
    }
  }
  delete m.text; delete m.img; delete m.audio; delete m.video;
  m.recalled = true;
  saveMe(rec);
  renderMsgs();
  showToast('已撤回');
}

function receiveMsg(key, msg){
  var rec = meRec();
  if (!rec) return;
  if (!rec.chats[key]) rec.chats[key] = [];
  if (msg.w === 'them' && msg.mentions && msg.mentions.length && rec.groups[key]) {
    var mentioned = msg.mentions.some(function(mn){ return mn.uid === myUid; }) ||
                    msg.mentions.some(function(mn){ return mn.all; });
    if (mentioned) {
      var gname = rec.groups[key].name;
      showToast((msg.fromName||'有人') + ' 在「' + gname + '」@了你' +
        (msg.mentions.some(function(mn){return mn.all;}) ? '（@所有人）' : ''), true);
    }
  }
  rec.chats[key].push(msg);
  if (rec.chats[key].length > 300) rec.chats[key] = rec.chats[key].slice(-300);
  saveMe(rec);
  if (currentChat === key) {
    renderMsgs();
    if (chatType === 'friend' && msg.w === 'them') {
      sendReadReceipt(key, msg.ts);
    }
  } else {
    if (!(msg.mentions && msg.mentions.length)) {
      unread[key] = (unread[key] || 0) + 1;
    }
    var preview = msg.sysText ? msg.sysText.slice(0,20) :
                  msg.video ? '[视频]' :
                  msg.audio ? '[语音]' :
                  msg.img ? '[贴图]' : String(msg.text || '').replace(/\[\[mn:[^\]]+\]\]/g, '@').slice(0, 20);
    var who = msg.fromName || (rec.contacts[key] ? displayName(rec, key, rec.contacts[key].name) : (rec.groups[key] ? rec.groups[key].name : ''));
    if (who) showToast(who + '：' + preview);
  }
  renderContacts();
}

/* ═══════════ 连接建立（迟到连接作废） ═══════════ */
function ensureConn(uid, cb, onFail){
  var c = conns[uid];
  if (c && c.open) { if (cb) cb(c); return; }
  updateChatStatus();
  if (!peer || !peer.open) {
    if (onFail) onFail();
    return;
  }
  var nc = peer.connect(peerIdOf(uid), { reliable: true });
  var opened = false;
  var finished = false;
  var timer = setTimeout(function(){
    if (!opened && !finished) {
      finished = true;
      try { nc.close(); } catch(e) {}
      updateChatStatus();
      if (onFail) onFail();
    }
  }, 15000);
  nc.on('open', function(){
    if (finished) {
      try { nc.close(); } catch(e) {}
      return;
    }
    opened = true;
    finished = true;
    clearTimeout(timer);
    conns[uid] = nc;
    updateChatStatus();
    var rec = meRec();
    try { nc.send({ t: 'profile', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' }); } catch(e) {}
    if (cb) cb(nc);
  });
  nc.on('error', function(){
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    updateChatStatus();
    if (onFail) onFail();
  });
  nc.on('close', function(){
    if (conns[uid] === nc) {
      delete conns[uid];
      updateChatStatus();
    }
  });
}

/* ═══════════ 语音条 ═══════════ */
var mediaRecorder = null, audioChunks = [], recStartTs = 0, recTimerInt = null;
var MIC_OK = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
                window.MediaRecorder);
if (!MIC_OK) $('btnMic').hidden = true;

 $('btnMic').addEventListener('mousedown', startRecording);
 $('btnMic').addEventListener('touchstart', function(e){ e.preventDefault(); startRecording(); });
document.addEventListener('mouseup', stopRecording);
document.addEventListener('touchend', function(e){ if (mediaRecorder) stopRecording(); });

function startRecording(){
  if (mediaRecorder || !MIC_OK || !currentChat) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    try {
      audioChunks = [];
      var opts = {};
      if (MediaRecorder.isTypeSupported('audio/webm')) opts.mimeType = 'audio/webm';
      else if (MediaRecorder.isTypeSupported('audio/mp4')) opts.mimeType = 'audio/mp4';
      mediaRecorder = new MediaRecorder(stream, opts);
      recStartTs = Date.now();
      mediaRecorder.ondataavailable = function(e){
        if (e.data && e.data.size) audioChunks.push(e.data);
      };
      mediaRecorder.onstop = function(){
        stream.getTracks().forEach(function(t){ try { t.stop(); } catch(e2) {} });
        var dur = Math.round((Date.now() - recStartTs) / 1000);
        var btn = $('btnMic');
        btn.classList.remove('recording');
        btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>';
        if (recTimerInt) { clearInterval(recTimerInt); recTimerInt = null; }
        if (dur < 1) { showToast('说话时间太短'); mediaRecorder = null; return; }
        var blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        mediaRecorder = null;
        if (dur > 60) { showToast('语音超过 60 秒，已取消', true); return; }
        var reader = new FileReader();
        reader.onload = function(){
          var dataUrl = reader.result;
          if (dataUrl.length > 1200000) { showToast('语音过大，发送失败', true); return; }
          sendAudio(dataUrl, dur);
        };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start();
      $('btnMic').classList.add('recording');
      var sec = 0;
      recTimerInt = setInterval(function(){
        sec++;
        $('btnMic').textContent = sec + 's';
        if (sec >= 60) stopRecording();
      }, 1000);
      showToast('松开发送，最长 60 秒');
    } catch(e) {
      stream.getTracks().forEach(function(t){ try { t.stop(); } catch(e2) {} });
      showToast('录音启动失败：' + e.message, true);
      mediaRecorder = null;
    }
  }).catch(function(){
    mediaRecorder = null;
    showToast('麦克风权限被拒绝，无法录音', true);
  });
}
function stopRecording(){
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    try { mediaRecorder.stop(); } catch(e) {}
  }
}
function sendAudio(dataUrl, dur){
  if (!currentChat) return;
  var key = currentChat;
  var rec = meRec();
  if (!rec.chats[key]) rec.chats[key] = [];
  var ts = Date.now();
  var msg = { w: 'me', audio: dataUrl, dur: dur, ts: ts, pending: true };
  rec.chats[key].push(msg);
  if (rec.chats[key].length > 300) rec.chats[key] = rec.chats[key].slice(-300);
  saveMe(rec);
  renderMsgs();
  if (chatType === 'group') {
    var g = rec.groups[key];
    if (!g) return;
    var payload = { t: 'gmsg', uid: myUid, name: rec.name || me, audio: dataUrl, dur: dur, gid: key, ts: ts };
    deliverOrQueue(g.owner, key, payload, ts);
    if (g.owner === myUid) {
      g.members.forEach(function(m){
        if (m.uid === myUid) return;
        deliverOrQueue(m.uid, key, payload, 0);
      });
      markSent(key, ts);
    }
  } else {
    deliverOrQueue(key, key, { t: 'audio', uid: myUid, audio: dataUrl, dur: dur, ts: ts }, ts);
  }
}

/* 视频压缩：转码为小尺寸低码率 webm，控制在可发送体积内 */
function handleVideoFile(file){
  if (!URL.createObjectURL) { showToast('浏览器不支持视频处理', true); return; }
  showToast('正在压缩视频，请稍候…');
  var inUrl = URL.createObjectURL(file);
  var v = document.createElement('video');
  v.muted = true;
  v.playsInline = true;
  v.src = inUrl;
  var failed = setTimeout(function(){
    cleanup();
    showToast('视频读取超时或格式不支持', true);
  }, 15000);
  function cleanup(){
    clearTimeout(failed);
    try { URL.revokeObjectURL(inUrl); } catch(e) {}
  }
  v.onloadedmetadata = function(){
    /* 太长的视频直接拒绝（压缩后体积不可控） */
    if (v.duration > 60) {
      cleanup();
      showToast('视频过长（超 60 秒），请剪辑后再发', true);
      return;
    }
    var MAXW = 480;
    var scale = Math.min(1, MAXW / Math.max(v.videoWidth, 1));
    var cv = document.createElement('canvas');
    cv.width = Math.max(2, Math.round(v.videoWidth * scale / 2) * 2);
    cv.height = Math.max(2, Math.round(v.videoHeight * scale / 2) * 2);
    var ctx = cv.getContext('2d');
    var stream;
    try {
      stream = cv.captureStream(15);   /* 15fps 足够看 */
    } catch(e) {
      cleanup();
      showToast('此浏览器不支持视频压缩', true);
      return;
    }
    var audioStream = null;
    try {
      /* 提取原视频音轨 */
      var av = v.captureStream ? null : null;
    } catch(e) {}
    /* 用 WebAudio 重新封装原视频的音频（若可获取） */
    try {
      var ac = new (window.AudioContext || window.webkitAudioContext)();
      var srcNode = ac.createMediaElementSource(v);
      var dest = ac.createMediaStreamDestination();
      srcNode.connect(dest);
      srcNode.connect(ac.destination);
      audioStream = dest.stream;
      audioStream._ac = ac;
    } catch(e) { audioStream = null; }
    var tracks = stream.getVideoTracks();
    if (audioStream && audioStream.getAudioTracks().length) {
      tracks = tracks.concat(audioStream.getAudioTracks());
    }
    var mixStream = new MediaStream(tracks);
    var mtype = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus') ? 'video/webm;codecs=vp8,opus'
              : MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '';
    if (!mtype) {
      cleanup();
      showToast('此浏览器不支持视频压缩', true);
      return;
    }
    var mr;
    try {
      mr = new MediaRecorder(mixStream, {
        mimeType: mtype,
        videoBitsPerSecond: 500000,    /* 500kbps，够清晰又小 */
        audioBitsPerSecond: 48000
      });
    } catch(e) {
      cleanup();
      showToast('此浏览器不支持视频压缩', true);
      return;
    }
    var chunks = [];
    mr.ondataavailable = function(ev){
      if (ev.data && ev.data.size) chunks.push(ev.data);
    };
    mr.onstop = function(){
      cleanup();
      if (audioStream && audioStream._ac) { try { audioStream._ac.close(); } catch(e2) {} }
      var blob = new Blob(chunks, { type: 'video/webm' });
      var reader = new FileReader();
      reader.onload = function(){
        var dataUrl = reader.result;
        if (dataUrl.length > VIDEO_MAX) {
          showToast('视频压缩后仍过大（' + fmtSize(blob.size) + '），请缩短时长', true);
          return;
        }
        showToast('压缩完成（' + fmtSize(blob.size) + '），发送中…');
        sendVideo(dataUrl, blob.size);
      };
      reader.readAsDataURL(blob);
    };
    /* 播放并录制：视频画到 canvas，音频直连 */
    v.onended = function(){ setTimeout(function(){ try { mr.stop(); } catch(e) {} }, 300); };
    v.onerror = function(){
      try { mr.stop(); } catch(e) {}
    };
    v.currentTime = 0;
    v.muted = false;
    v.play().then(function(){
      mr.start(250);
      function drawLoop(){
        if (v.ended || v.paused) return;
        ctx.drawImage(v, 0, 0, cv.width, cv.height);
        requestAnimationFrame(drawLoop);
      }
      requestAnimationFrame(drawLoop);
      /* 安全兜底：到时长上限强制停 */
      setTimeout(function(){ try { if (mr.state === 'recording') mr.stop(); } catch(e) {} }, (v.duration + 2) * 1000);
    }).catch(function(){
      try { mr.stop(); } catch(e) {}
    });
  };
  v.onerror = function(){
    cleanup();
    showToast('无法读取该视频文件', true);
  };
}

function sendImage(dataUrl){
  if (!currentChat) return;
  var key = currentChat;
  var rec = meRec();
  if (!rec.chats[key]) rec.chats[key] = [];
  var ts = Date.now();
  var msg = { w: 'me', img: dataUrl, ts: ts, pending: true };
  rec.chats[key].push(msg);
  if (rec.chats[key].length > 300) rec.chats[key] = rec.chats[key].slice(-300);
  saveMe(rec);
  renderMsgs();
  if (chatType === 'group') {
    var g = rec.groups[key];
    if (!g) return;
    var payload = { t: 'gmsg', uid: myUid, name: rec.name || me, img: dataUrl, gid: key, ts: ts };
    deliverOrQueue(g.owner, key, payload, ts);
    if (g.owner === myUid) {
      g.members.forEach(function(m){
        if (m.uid === myUid) return;
        deliverOrQueue(m.uid, key, payload, 0);
      });
      markSent(key, ts);
    }
  } else {
    deliverOrQueue(key, key, { t: 'sticker', uid: myUid, img: dataUrl, ts: ts }, ts);
  }
}
function sendVideo(dataUrl, size){
  if (!currentChat) return;
  var key = currentChat;
  var rec = meRec();
  if (!rec.chats[key]) rec.chats[key] = [];
  var ts = Date.now();
  var msg = { w: 'me', video: dataUrl, vsize: size, ts: ts, pending: true };
  rec.chats[key].push(msg);
  if (rec.chats[key].length > 300) rec.chats[key] = rec.chats[key].slice(-300);
  saveMe(rec);
  renderMsgs();
  if (chatType === 'group') {
    var g = rec.groups[key];
    if (!g) return;
    var payload = { t: 'gmsg', uid: myUid, name: rec.name || me, video: dataUrl, vsize: size, gid: key, ts: ts };
    deliverOrQueue(g.owner, key, payload, ts);
    if (g.owner === myUid) {
      g.members.forEach(function(m){
        if (m.uid === myUid) return;
        deliverOrQueue(m.uid, key, payload, 0);
      });
      markSent(key, ts);
    }
  } else {
    deliverOrQueue(key, key, { t: 'video', uid: myUid, video: dataUrl, vsize: size, ts: ts }, ts);
  }
}

/* ═══════════ 发送消息 ═══════════ */
function sendMsg(){
  var input = $('msgInput');
  var text = input.value.replace(/^\s+|\s+$/g, '');
  if (!text || !currentChat) return;
  var key = currentChat;
  input.value = '';
  var rec = meRec();
  if (!rec.chats[key]) rec.chats[key] = [];
  var ts = Date.now();

  var mentions = [];
  var mentionsOut = [];
  if (chatType === 'group' && pendingMentions.length) {
    pendingMentions.forEach(function(mn){
      mentions.push({ uid: mn.uid || '', all: !!mn.all, name: mn.name });
      mentionsOut.push(mn);
    });
    pendingMentions = [];
    mentionsOut.forEach(function(mn){
      text = text.replace('@' + mn.name, '[[mn:' + (mn.uid || '') + ':' + mn.name + ']]');
    });
  }

  var msg = { w: 'me', text: text, ts: ts, pending: true, mentions: mentions };
  rec.chats[key].push(msg);
  if (rec.chats[key].length > 300) rec.chats[key] = rec.chats[key].slice(-300);
  saveMe(rec);
  renderMsgs();

  if (chatType === 'group') {
    var g = rec.groups[key];
    if (!g) return;
    var payload = { t: 'gmsg', uid: myUid, name: rec.name || me, text: text, gid: key, ts: ts, mentions: mentions };
    deliverOrQueue(g.owner, key, payload, ts);
    mentionsOut.forEach(function(mn){
      if (mn.all) {
        g.members.forEach(function(m){
          if (m.uid === myUid) return;
          deliverOrQueue(m.uid, key, { t: 'gmention', uid: myUid, name: rec.name || me, gid: key, names: [], all: true }, 0);
        });
      } else if (mn.uid) {
        deliverOrQueue(mn.uid, key, { t: 'gmention', uid: myUid, name: rec.name || me, gid: key, names: [mn.name], all: false }, 0);
      }
    });
    if (g.owner === myUid) {
      g.members.forEach(function(m){
        if (m.uid === myUid) return;
        deliverOrQueue(m.uid, key, payload, 0);
      });
      markSent(key, ts);
    }
  } else {
    deliverOrQueue(key, key, { t: 'chat', uid: myUid, text: text, ts: ts }, ts);
  }
}
 $('btnSend').onclick = sendMsg;
 $('msgInput').onkeydown = function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
};

var epTab = 'emoji';

function hideEmojiPanel(){
  $('emojiPanel').hidden = true;
  $('btnEmoji').classList.remove('on');
}

function setEpTab(t){

  $('epTabEmoji').className = t === 'emoji' ? 'on' : '';

(function(){
  var grid = $('epEmoji');
  EMOJIS.forEach(function(em){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = em;
    b.onclick = function(){

      $('msgInput').focus();
    };

  });
})();

function renderStickerGrid(){
  var grid = $('epSticker');
  grid.innerHTML = '';
  var rec = meRec();
  if (!rec) return;
  var stickers = rec.stickers || [];
  stickers.forEach(function(dataUrl, idx){
    var img = document.createElement('img');
    img.className = 'stk';
    img.src = dataUrl;
    img.title = '点击发送 / 右键删除';
    img.oncontextmenu = function(e){
      e.preventDefault();
      if (confirm('从贴图收藏中删除这张？')) {
        rec.stickers.splice(idx, 1);
        saveMe(rec);
        renderStickerGrid();
      }
    };
    img.onclick = function(){ sendImage(dataUrl); };
    grid.appendChild(img);
  });
  var add = document.createElement('button');
  add.type = 'button';
  add.className = 'sticker-add';
  add.textContent = '+';
  add.title = '添加贴图（右键贴图可删除）';
  add.onclick = function(){ $('stickerFile').click(); };
  grid.appendChild(add);
}
 $('stickerFile').onchange = function(){
  var f = this.files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { showToast('图片太大，请选 8MB 以内', true); this.value=''; return; }
  compressImage(f, 240, function(dataUrl, err){
    if (err) { showToast('图片处理失败：' + err, true); return; }
    var rec = meRec();
    if (!rec.stickers) rec.stickers = [];
    if (rec.stickers.length >= 18) { showToast('贴图收藏已满（18 张）', true); return; }
    rec.stickers.push(dataUrl);
    saveMe(rec);
    renderStickerGrid();
    showToast('贴图已收藏');
  });
  this.value = '';
};
function compressImage(file, maxPx, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      try {
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxPx / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * scale);
        cv.height = Math.round(h * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        var type = (file.type === 'image/png') ? 'image/png' : 'image/jpeg';
        var out = cv.toDataURL(type, 0.8);
        if (out.length > 500000) {
          out = cv.toDataURL('image/jpeg', 0.5);
          if (out.length > 500000) { cb(null, '压缩后仍过大'); return; }
        }
        cb(out, null);
      } catch(e) { cb(null, e.message); }
    };
    img.onerror = function(){ cb(null, '无法读取该图片'); };
    img.src = reader.result;
  };
  reader.onerror = function(){ cb(null, '读取文件失败'); };
  reader.readAsDataURL(file);
}

}
 $('wvBack').onclick = function(){

/* ═══════════ 备份 / 导入 ═══════════ */
 $('btnBackup').onclick = function(){
  try {
    var data = { app: 'azchat', ver: 2, db: storage.getItem(DB_KEY) };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'azchat-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    showToast('备份文件已开始下载');
  } catch(e) {
    showToast('备份失败：' + e.message, true);
  }
};
 $('btnImport').onclick = function(){ $('importFile').click(); };
 $('importFile').onchange = function(){
  var f = this.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var data = JSON.parse(r.result);
      if (!data || data.app !== 'azchat' || !data.db) { showToast('备份文件格式不正确', true); return; }
      if (!confirm('导入会合并本机数据（同名账号将被备份覆盖），确定继续？')) return;
      var cur = JSON.parse(storage.getItem(DB_KEY) || '{}');
      var back = JSON.parse(data.db);
      var count = 0;
      for (var n in back) {
        back[n] = normalizeAccount(back[n], n) || back[n];
        cur[n] = back[n];
        count++;
      }
      storage.setItem(DB_KEY, JSON.stringify(cur));
      showToast('导入成功，共 ' + count + ' 个账号');
    } catch(e) {
      showToast('导入失败：' + e.message, true);
    }
  };
  r.readAsText(f);
  this.value = '';
};

if (storageIsMemory) {
  setTimeout(function(){ showToast('当前环境禁止本地存储，无法记住登录状态', true); }, 800);
}
