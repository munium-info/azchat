<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AzChat · 点对点聊天</title>
<style>
  :root{
    --bg:#F2F2F2; --panel:#FFFFFF; --ink:#191919; --sub:#9A9A9A;
    --line:#E6E6E6; --green:#07C160; --bubble:#95EC69; --chatbg:#EDEDED;
    --unread:#FA5151;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-size:14px;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input{font-family:inherit;outline:none}
  [hidden]{display:none !important}

  #toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-80px);z-index:600;
    background:#3A3A3A;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);transition:transform .3s;
    pointer-events:none;max-width:88vw;text-align:center;word-break:break-all}
  #toast.show{transform:translate(-50%,0)}
  #toast.err{background:#C0392B}

  /* ══ 登录/注册 ══ */
  #authView{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px}
  .logo{width:64px;height:64px;border-radius:16px;background:var(--green);display:flex;
    align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:700}
  .auth-title{font-size:21px;font-weight:600;margin:16px 0 4px}
  .auth-sub{font-size:12.5px;color:var(--sub);margin-bottom:28px}
  .auth-box{width:100%;max-width:330px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px}
  .field input{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;font-size:14px;transition:border-color .15s}
  .field input:focus{border-color:var(--green)}
  .field input.uid-input{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center}
  .field .hint{font-size:11px;color:var(--sub);margin-top:5px}
  .remember-row{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:13px;color:var(--sub);cursor:pointer;user-select:none}
  .remember-row input{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
  .form-err{color:var(--unread);font-size:12.5px;min-height:20px;margin-bottom:6px}
  .btn-primary{width:100%;background:var(--green);color:#fff;border-radius:8px;padding:13px;
    font-size:15px;font-weight:500}
  .btn-primary:hover{opacity:.9}
  .tabs{display:flex;background:#E9E9E9;border-radius:8px;padding:3px;margin-bottom:22px}
  .tabs button{flex:1;padding:9px;border-radius:6px;font-size:13.5px;color:var(--sub)}
  .tabs button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .auth-note{margin-top:26px;font-size:11.5px;color:var(--sub);text-align:center;line-height:1.9}

  /* ══ 主界面 ══ */
  #appView{height:100%;display:flex}
  #sidebar{width:280px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0}
  .sb-head{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .sb-head:hover{background:#FAFAFA}
  .sb-head b{font-size:15px}
  .sb-me-name{font-size:14px;font-weight:600}
  .sb-me-uid{font-size:10.5px;color:var(--sub);font-family:ui-monospace,Menlo,monospace}
  .net-status{padding:0 16px 10px;font-size:12px;color:var(--sub);line-height:1.5}
  .btn-row{display:flex;gap:8px;padding:0 16px 10px}
  .btn-row button{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
    background:var(--green);color:#fff;border-radius:8px;padding:9px 4px;font-size:12.5px;font-weight:500}
  .btn-row button:hover{opacity:.9}
  .sb-label{padding:6px 16px 2px;font-size:11px;color:var(--sub);letter-spacing:.1em}
  #contactList{flex:1;overflow-y:auto;padding-bottom:10px}
  .c-item{display:flex;align-items:center;gap:11px;padding:10px 16px;cursor:pointer;position:relative}
  .c-item:hover{background:#F5F5F5}
  .c-item.on{background:#EBEBEB}
  .avatar{width:42px;height:42px;border-radius:8px;color:#fff;font-size:17px;font-weight:600;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative}
  .avatar img,.m-avatar img,.big-avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
  .c-info{flex:1;min-width:0}
  .c-name{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-uid{font-size:11px;color:var(--sub);font-family:ui-monospace,Menlo,monospace}
  .c-dot{position:absolute;left:50px;top:10px;min-width:17px;height:17px;border-radius:9px;background:var(--unread);
    color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}
  .c-empty{padding:36px 24px;text-align:center;color:var(--sub);font-size:12.5px;line-height:1.9}
  .sb-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
  .sb-foot button{flex:1;padding:8px 4px;font-size:12.5px;color:var(--sub);border-radius:6px;white-space:nowrap}
  .sb-foot button:hover{background:#F0F0F0;color:var(--ink)}

  #chatPane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chatbg)}
  #chatEmpty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--sub)}
  #chatEmpty .logo{opacity:.25}
  .chat-head{padding:13px 20px;background:#F7F7F7;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px}
  .btn-back{display:none;width:28px;height:28px;color:var(--sub);align-items:center;justify-content:center;font-size:20px}
  .ch-name{font-size:16px;font-weight:600}
  .ch-uid{font-size:11px;color:var(--sub);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
  .ch-status{margin-left:auto;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .btn-more{width:30px;height:30px;color:var(--sub);font-size:18px;display:flex;align-items:center;justify-content:center;border-radius:6px}
  .btn-more:hover{background:#EAEAEA;color:var(--ink)}
  .dot{width:7px;height:7px;border-radius:50%;background:#C4C4C4}
  .dot.live{background:var(--green)}
  #msgs{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .t-div{align-self:center;font-size:11.5px;color:#A6A6A6;background:#DADADA;border-radius:4px;padding:3px 9px}
  .m-row{display:flex;gap:10px;max-width:78%;align-items:flex-start}
  .m-row.me{flex-direction:row-reverse;align-self:flex-end}
  .m-row.them{align-self:flex-start}
  .m-avatar{width:36px;height:36px;border-radius:6px;color:#fff;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;overflow:hidden}
  .m-col{display:flex;flex-direction:column;gap:3px;min-width:0}
  .m-sender{font-size:11px;color:#9A9A9A;padding:0 4px}
  .m-bubble{padding:10px 13px;border-radius:8px;font-size:14.5px;line-height:1.55;
    white-space:pre-wrap;word-break:break-word}
  .m-bubble.has-img{padding:5px;background:#fff;white-space:normal}
  .m-bubble img{max-width:160px;max-height:160px;border-radius:5px;display:block;cursor:zoom-in}
  .them .m-bubble{background:#fff}
  .me .m-bubble{background:var(--bubble)}
  .me .m-bubble.has-img{background:#fff}
  .m-pending{font-size:10px;color:#C8A415;margin-left:4px}
  .m-link{color:#576B95;text-decoration:none;cursor:pointer;word-break:break-all}
  .m-link:hover{text-decoration:underline}

  /* ══ 表情面板 ══ */
  .composer-wrap{background:#F7F7F7;border-top:1px solid var(--line)}
  #emojiPanel{background:#F7F7F7;border-top:1px solid var(--line);padding:10px 14px;max-height:220px;overflow-y:auto}
  .ep-tabs{display:flex;gap:16px;margin-bottom:10px;font-size:13px}
  .ep-tabs button{color:var(--sub);padding:2px 4px;border-radius:5px}
  .ep-tabs button.on{color:var(--ink);font-weight:600;background:#EAEAEA}
  .emoji-grid{display:flex;flex-wrap:wrap;gap:2px}
  .emoji-grid button{width:34px;height:34px;font-size:22px;border-radius:6px;line-height:1}
  .emoji-grid button:hover{background:#E8E8E8}
  .sticker-grid{display:flex;flex-wrap:wrap;gap:8px}
  .sticker-grid .stk{width:56px;height:56px;border-radius:8px;background:#fff;border:1px solid var(--line);
    padding:3px;cursor:pointer;object-fit:contain}
  .sticker-grid .stk:hover{border-color:var(--green)}
  .sticker-add{width:56px;height:56px;border-radius:8px;border:1px dashed #C4C4C4;color:var(--sub);
    font-size:22px;display:flex;align-items:center;justify-content:center;background:#fff}
  .sticker-add:hover{border-color:var(--green);color:var(--green)}
  .composer{display:flex;gap:10px;padding:12px 18px 14px;align-items:center}
  .btn-emoji{width:36px;height:40px;font-size:22px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;flex-shrink:0}
  .btn-emoji:hover{background:#EAEAEA}
  .btn-emoji.on{background:#E0E0E0}
  .composer input{flex:1;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;background:#fff}
  .composer input:focus{border-color:var(--green)}
  .btn-send{background:var(--green);color:#fff;border-radius:8px;padding:0 22px;font-size:14px;font-weight:500;
    height:42px;flex-shrink:0}

  /* ══ 内置浏览器 ══ */
  #webview{position:fixed;inset:0;background:#fff;z-index:500;display:flex;flex-direction:column}
  .wv-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F7F7F7;border-bottom:1px solid var(--line)}
  .wv-bar button{color:#576B95;font-size:14px;padding:6px 10px;border-radius:6px}
  .wv-bar button:hover{background:#EAEAEA}
  .wv-title{flex:1;text-align:center;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wv-url{font-size:11px;color:var(--sub);text-align:center;padding:4px;background:#FFFBE6;
    font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wv-hint{font-size:11px;color:#B08A2E;text-align:center;padding:4px;background:#FFF8E1;line-height:1.5}
  #wvFrame{flex:1;width:100%;border:none;background:#fff}

  #imgViewer{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:550;
    display:flex;align-items:center;justify-content:center;cursor:zoom-out}
  #imgViewer img{max-width:92vw;max-height:88vh;border-radius:8px}

  /* ══ 弹窗 ══ */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:400;display:flex;
    align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:340px;padding:22px;
    max-height:84vh;overflow-y:auto}
  .modal h3{font-size:16px;margin-bottom:16px;font-weight:600}
  .req-user{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .req-msg{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:18px}
  .modal-btns{display:flex;gap:10px}
  .mbtn{flex:1;padding:11px;border-radius:8px;font-size:14px;font-weight:500}
  .mbtn.gray{background:#F0F0F0;color:var(--ink)}
  .mbtn.green{background:var(--green);color:#fff}
  .modal-close{float:right;color:var(--sub);font-size:20px;line-height:1;padding:2px 4px}
  .modal-close:hover{color:var(--ink)}
  .fm-info{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .big-avatar{width:56px;height:56px;border-radius:10px;color:#fff;font-size:22px;font-weight:600;
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
  .fm-item{border-top:1px solid var(--line)}
  .fm-item button{width:100%;text-align:left;padding:12px 4px;font-size:14.5px;color:var(--ink)}
  .fm-item button.danger{color:var(--unread)}
  .fm-item button:hover{background:#FAFAFA}
  /* 群成员列表 */
  .gm-list{margin-bottom:10px}
  .gm-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F2F2F2}
  .gm-item .avatar{width:34px;height:34px;font-size:14px}
  .gm-name{flex:1;font-size:14px}
  .gm-role{font-size:10px;border-radius:4px;padding:1px 6px}
  .role-owner{color:#B8860B;background:#FFF6D9}
  .role-admin{color:#576B95;background:#E8F0FE}
  .role-member{color:var(--sub);background:#F2F2F2}
  .gm-ops{display:flex;gap:6px}
  .gm-ops button{font-size:11px;color:#576B95;padding:3px 8px;border-radius:5px;background:#F2F6FC}
  .gm-ops button:hover{background:#E0EAFB}
  .gm-ops button.danger{color:var(--unread);background:#FDEEEE}
  /* 好友多选 */
  .pick-list{max-height:220px;overflow-y:auto;margin-bottom:14px;border:1px solid var(--line);border-radius:8px}
  .pick-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid #F5F5F5}
  .pick-item:last-child{border-bottom:none}
  .pick-item:hover{background:#F7F7F7}
  .pick-item input{width:16px;height:16px;accent-color:var(--green)}
  .pick-item .avatar{width:32px;height:32px;font-size:13px}

  @media (max-width:680px){
    #sidebar{width:100%;border-right:none}
    #chatPane{position:fixed;inset:0;z-index:10;display:none}
    #chatPane.open{display:flex}
    .btn-back{display:flex}
  }
</style>
</head>
<body>

<div id="toast"></div>

<!-- ═══════ 登录 / 注册 ═══════ -->
<main id="authView" hidden>
  <div class="logo">A</div>
  <div class="auth-title">AzChat</div>
  <div class="auth-sub">点对点加密聊天 · 登录一次，以后自动进入</div>
  <div class="auth-box">
    <div class="tabs">
      <button type="button" id="tabLogin" class="on">登录</button>
      <button type="button" id="tabReg">注册</button>
    </div>
    <form id="authForm" novalidate>
      <div class="field" id="fUidWrap">
        <label>AzChat ID</label>
        <input id="fUid" class="uid-input" type="text" placeholder="AZ + 8 位字符" maxlength="10" autocomplete="off">
      </div>
      <div class="field" id="fUserWrap" hidden>
        <label>昵称</label>
        <input id="fUser" type="text" placeholder="2–16 个字符" maxlength="16" autocomplete="off">
        <div class="hint">注册成功后自动分配你的专属 ID</div>
      </div>
      <div class="field">
        <label>密码</label>
        <input id="fPass" type="password" placeholder="至少 6 位">
      </div>
      <div class="field" id="fPass2Wrap" hidden>
        <label>确认密码</label>
        <input id="fPass2" type="password" placeholder="再输入一次">
      </div>
      <label class="remember-row" id="rememberRow">
        <input type="checkbox" id="fRemember" checked>
        记住我，以后打开直接进入
      </label>
      <div class="form-err" id="formErr"></div>
      <button type="submit" class="btn-primary" id="authSubmit">进入</button>
    </form>
  </div>
  <p class="auth-note">登录一次后，每次打开网址都会自动进入聊天<br>消息经 WebRTC 端到端加密，不经服务器存储明文</p>
</main>

<!-- ═══════ 主界面 ═══════ -->
<div id="appView" hidden>
  <aside id="sidebar">
    <!-- 个人信息（点头像改头像/昵称） -->
    <div class="sb-head" id="sbMe" title="点击修改头像和昵称">
      <div class="avatar" id="myAvatar" style="background:var(--green)">A</div>
      <div>
        <div class="sb-me-name" id="myName">—</div>
        <div class="sb-me-uid" id="myUidShort">—</div>
      </div>
      <span style="margin-left:auto;color:var(--sub);font-size:12px">✏️</span>
    </div>
    <div class="net-status" id="netStatus">● 正在连接信令服务器…</div>
    <div class="sb-id" style="display:none" id="uidRow">
      <div class="id-chip">
        <code id="myUid">—</code>
        <button type="button" id="btnCopyUid">复制</button>
      </div>
    </div>
    <div class="btn-row">
      <button type="button" id="btnAddFriend">＋ 好友</button>
      <button type="button" id="btnCreateGroup">👥 群聊</button>
    </div>
    <div class="sb-label">消息</div>
    <div id="contactList"></div>
    <div class="sb-foot">
      <button type="button" id="btnBackup">备份</button>
      <button type="button" id="btnImport">导入</button>
      <button type="button" id="btnLogout">退出</button>
    </div>
  </aside>

  <section id="chatPane">
    <div id="chatEmpty">
      <div class="logo" style="opacity:.25">A</div>
      <div>选择好友或群聊开始聊天</div>
    </div>
    <div id="chatBox" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="chat-head">
        <button type="button" class="btn-back" id="btnBack">‹</button>
        <div>
          <div class="ch-name" id="chName"></div>
          <div class="ch-uid" id="chUid"></div>
        </div>
        <div class="ch-status"><span class="dot" id="chDot"></span><span id="chStatus">未连接</span></div>
        <button type="button" class="btn-more" id="btnMore" title="聊天设置">⋯</button>
      </div>
      <div id="msgs"></div>
      <div class="composer-wrap">
        <div id="emojiPanel" hidden>
          <div class="ep-tabs">
            <button type="button" id="epTabEmoji" class="on">😊 Emoji</button>
            <button type="button" id="epTabSticker">🖼 贴图</button>
          </div>
          <div id="epEmoji" class="emoji-grid"></div>
          <div id="epSticker" class="sticker-grid" hidden></div>
        </div>
        <div class="composer">
          <button type="button" class="btn-emoji" id="btnEmoji" title="表情">😊</button>
          <input id="msgInput" type="text" placeholder="输入消息…" maxlength="2000">
          <button type="button" class="btn-send" id="btnSend">发送</button>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- 内置浏览器 -->
<div id="webview" hidden>
  <div class="wv-bar">
    <button type="button" id="wvBack">‹ 返回</button>
    <div class="wv-title" id="wvTitle">加载中…</div>
    <button type="button" id="wvRefresh">⟳</button>
    <button type="button" id="wvExternal">↗ 新窗口</button>
  </div>
  <div class="wv-url" id="wvUrl"></div>
  <div class="wv-hint">部分网站禁止内嵌显示为空白，请点「新窗口」打开</div>
  <iframe id="wvFrame" rel="noreferrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</div>

<div id="imgViewer" hidden><img id="imgViewerSrc" alt=""></div>

<!-- 添加好友弹窗 -->
<div class="mask" id="addModal" hidden>
  <div class="modal">
    <button type="button" class="modal-close" data-close="addModal">×</button>
    <h3>添加好友</h3>
    <div class="field">
      <label>对方 AzChat ID</label>
      <input id="addInput" class="uid-input" type="text" placeholder="AZ + 8 位字符" maxlength="10">
    </div>
    <div class="form-err" id="addErr"></div>
    <button type="button" class="mbtn green" id="btnDoAdd" style="width:100%">发送添加请求</button>
  </div>
</div>

<!-- 好友验证弹窗 -->
<div class="mask" id="reqModal" hidden>
  <div class="modal">
    <h3>好友添加请求</h3>
    <div class="req-user">
      <div class="avatar" id="reqAvatar"></div>
      <div>
        <div style="font-weight:600;font-size:15px" id="reqName"></div>
        <div style="font-size:11px;color:var(--sub);font-family:ui-monospace,Menlo,monospace" id="reqUid"></div>
      </div>
    </div>
    <div class="req-msg" id="reqText"></div>
    <div class="modal-btns">
      <button type="button" class="mbtn gray" id="btnReject">拒绝</button>
      <button type="button" class="mbtn green" id="btnAccept">接受</button>
    </div>
  </div>
</div>

<!-- 建群弹窗 -->
<div class="mask" id="groupCreateModal" hidden>
  <div class="modal">

/* ═══════════ 存储兜底 ═══════════ */
var storageIsMemory = false;
var storage = (function(){
  try {
    window.localStorage.setItem('__az_t__','1');
    window.localStorage.removeItem('__az_t__');
    return window.localStorage;
  } catch(e) {
    storageIsMemory = true;
    var mem = {};
    return {
      getItem: function(k){ return Object.prototype.hasOwnProperty.call(mem,k) ? mem[k] : null; },
      setItem: function(k,v){ mem[k] = String(v); },
      removeItem: function(k){ delete mem[k]; }
    };
  }
})();

/* ═══════════ 纯 JS SHA-256 ═══════════ */
function sha256(msg){
  function rr(x,n){ return (x>>>n) | (x<<(32-n)); }
  var K = [], H0 = [], pc = 0, n = 2, i, p;
  while (pc < 64) {
    p = true;
    for (i = 2; i*i <= n; i++) { if (n % i === 0) { p = false; break; } }
    if (p) {
      K[pc] = ((Math.pow(n, 1/3) % 1) * 4294967296) | 0;
      if (pc < 8) H0[pc] = ((Math.pow(n, 1/2) % 1) * 4294967296) | 0;
      pc++;
    }
    n++;
  }
  var bin;
  try { bin = unescape(encodeURIComponent(msg)); }
  catch(e) { bin = msg; }
  var l = bin.length, bitLen = l * 8;
  var total = (((l + 9) + 63) >> 6) << 6;
  var words = new Array(total >> 2);
  for (i = 0; i < words.length; i++) words[i] = 0;
  for (i = 0; i < l; i++) words[i >> 2] |= bin.charCodeAt(i) << ((3 - (i & 3)) * 8);
  words[l >> 2] |= 0x80 << ((3 - (l & 3)) * 8);
  words[words.length - 1] = bitLen;
  var H = H0.slice(), w = new Array(64);
  for (var off = 0; off < words.length; off += 16) {
    for (i = 0; i < 16; i++) w[i] = words[off + i];
    for (i = 16; i < 64; i++) {
      var s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15]>>>3);
      var s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2]>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (i = 0; i < 64; i++) {
      var S1 = rr(e,6)^rr(e,11)^rr(e,25), ch = (e&f)^(~e&g);
      var t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      var S0 = rr(a,2)^rr(a,13)^rr(a,22), mj = (a&b)^(a&c)^(b&c);
      var t2 = (S0 + mj) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  var out = '';
  for (i = 0; i < 8; i++) out += ('00000000' + (H[i]>>>0).toString(16)).slice(-8);
  return out;
}

/* ═══════════ 随机 / 密码本地加密 ═══════════ */
function randHex(len){
  var out = '';
  try {
    var arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    for (var i = 0; i < len; i++) out += ('0' + arr[i].toString(16)).slice(-2);
  } catch(e) {
    while (out.length < len*2) out += Math.floor(Math.random()*256).toString(16).slice(-2);
  }
  return out.slice(0, len*2);
}
function deviceKey(){
  var k = storage.getItem('azchat_dk');
  if (!k) { k = randHex(16); storage.setItem('azchat_dk', k); }
  return k;
}
function encPass(pass){
  var key = deviceKey(), out = '';
  for (var i = 0; i < pass.length; i++) {
    out += String.fromCharCode(pass.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  try { return 'x' + btoa(unescape(encodeURIComponent(out))); }
  catch(e) { return null; }
}
function decPass(stored){
  if (!stored || stored.charAt(0) !== 'x') return null;
  try {
    var raw = decodeURIComponent(escape(atob(stored.slice(1))));
    var key = deviceKey(), out = '';
    for (var i = 0; i < raw.length; i++) {
      out += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return out;
  } catch(e) { return null; }
}

/* ═══════════ 工具 ═══════════ */
function $(id){ return document.getElementById(id); }
var AV_COLORS = ['#7A8B99','#8B7D9B','#99806E','#6E8B7B','#9B7D86','#6E7F9B','#8B9B6E','#9B8B6E'];
var toastTimer = null;
function showToast(msg, isErr){
  var el = $('toast');
  el.textContent = msg;
  el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = ''; }, isErr ? 6000 : 2600);
}
function two(n){ return n < 10 ? '0'+n : ''+n; }
function timeStr(ts){
  var d = new Date(ts), now = new Date();
  var hm = two(d.getHours()) + ':' + two(d.getMinutes());
  if (d.toDateString() === now.toDateString()) return hm;
  return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + hm;
}
function avatarColor(str){
  var n = 0;
  for (var i = 0; i < str.length; i++) n += str.charCodeAt(i);
  return AV_COLORS[n % AV_COLORS.length];
}
/* 头像节点：有自定义头像用图，否则用首字母色块 */

  el.style.background = avatarColor(String(key || name || '?'));

    img.alt = '';
    el.appendChild(img);

function roleLabel(role){

  if (role === 'admin') return '管理员';

}

  if (role === 'admin') return 'role-admin';
  return 'role-member';

function openModal(id){ $(id).hidden = false; }
function closeModal(id){ $(id).hidden = true; }
function copyText(text, okMsg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast(okMsg); }
    catch(e) { showToast('复制失败，请手动复制：' + text, true); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ showToast(okMsg); }, fallback);
  } else fallback();
}
var URL_RE = /(https?:\/\/[^\s<>"'）】」》。，、！？；：]+)/;
function domainOf(u){
  try { var a = document.createElement('a'); a.href = u; return a.hostname; }
  catch(e){ return u; }
}

/* ═══════════ 本地数据 ═══════════ */
var DB_KEY = 'azchat_v5', SES_KEY = 'azchat_session_v5';
function loadDB(){
  try { return JSON.parse(storage.getItem(DB_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveDB(d){ storage.setItem(DB_KEY, JSON.stringify(d)); }
function meRec(){ return loadDB()[me]; }
function saveMe(rec){ var d = loadDB(); d[me] = rec; saveDB(d); }
function findNameByUid(uid){
  var db = loadDB();
  for (var n in db) { if (db[n].uid === uid) return n; }
  return null;
}
function isGroupKey(key){ return !!(meRec() && meRec().groups && meRec().groups[key]); }

var me = null, myUid = null, peer = null;
var conns = {}, unread = {}, currentChat = null, chatType = 'friend';
var flushTimer = null;

/* ═══════════ 启动 ═══════════ */
(function(){
  try {
    var u = storage.getItem(SES_KEY);
    if (u && loadDB()[u]) { enterApp(u); return; }
  } catch(e) {}
  $('authView').hidden = false;
})();

/* ═══════════ 登录 / 注册 ═══════════ */
var regMode = false;
function setMode(r){
  regMode = r;
  $('tabLogin').className = r ? '' : 'on';
  $('tabReg').className = r ? 'on' : '';
  $('fUidWrap').hidden = r;
  $('fUserWrap').hidden = !r;
  $('fPass2Wrap').hidden = !r;
  $('rememberRow').style.display = r ? 'none' : 'flex';
  $('authSubmit').textContent = r ? '注册并获取 ID' : '进入';
  $('formErr').textContent = '';
}
 $('tabLogin').onclick = function(){ setMode(false); };
 $('tabReg').onclick = function(){ setMode(true); };

 $('fUid').oninput = function(e){
  var v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (v.slice(0,2) === 'AZ') v = v.slice(2);
  v = v.slice(0, 8);
  e.target.value = v ? 'AZ' + v : '';
};

 $('authForm').onsubmit = function(e){
  e.preventDefault();
  try {
    var err = $('formErr');
    var pass = $('fPass').value;
    if (pass.length < 6) { err.textContent = '密码至少 6 位'; return; }
    var db = loadDB();

    if (regMode) {
      var name = $('fUser').value.replace(/^\s+|\s+$/g, '');
      if (name.length < 2) { err.textContent = '昵称至少 2 个字符'; return; }
      if ($('fPass2').value !== pass) { err.textContent = '两次输入的密码不一致'; return; }
      if (db[name]) { err.textContent = '该昵称已被注册（本机）'; return; }
      var salt = randHex(8);
      var uid = 'AZ' + sha256('azchat-id::' + name + salt).slice(0, 8).toUpperCase();
      db[name] = { salt: salt, hash: sha256(salt + pass), uid: uid, name: name, avatar: '',
                   contacts: {}, chats: {}, stickers: [], groups: {}, outbox: [] };
      saveDB(db);
      showToast('注册成功！你的 ID：' + uid);
      enterApp(name);
    } else {
      var m = $('fUid').value.match(/^AZ([0-9A-Z]{8})$/);
      if (!m) { err.textContent = '请输入完整的 ID，格式为 AZ + 8 位字符'; return; }
      var loginUid = 'AZ' + m[1];
      var loginName = findNameByUid(loginUid);
      if (!loginName) { err.textContent = '该 ID 未在本机注册过，请先注册'; return; }
      var r2 = db[loginName];
      if (sha256(r2.salt + pass) !== r2.hash) { err.textContent = '密码错误'; return; }
      if (!r2.groups) r2.groups = {};
      if (!r2.outbox) r2.outbox = [];
      if (!r2.name) r2.name = loginName;
      if (r2.avatar === undefined) r2.avatar = '';
      if ($('fRemember').checked) {
        var enc = encPass(pass);
        if (enc) { r2.remembered = true; r2.encPass = enc; }
        var d2 = loadDB(); d2[loginName] = r2; saveDB(d2);
      }
      enterApp(loginName);
      showToast('欢迎回来，' + (r2.name || loginName));
    }
  } catch(ex) {
    $('formErr').textContent = '出错了：' + ex.message;
  }
};

function refreshMyIdentity(){
  var rec = meRec();
  $('myName').textContent = rec.name || me;
  $('myUidShort').textContent = rec.uid;
  $('myUid').textContent = rec.uid;
  var av = $('myAvatar');
  av.innerHTML = '';
  if (rec.avatar) {
    var img = document.createElement('img');
    img.src = rec.avatar;
    av.appendChild(img);
  } else {
    av.textContent = (rec.name || me).charAt(0).toUpperCase();
  }
}

function enterApp(name){
  me = name;
  var rec = loadDB()[name];
  if (!rec.stickers) rec.stickers = [];
  if (!rec.groups) rec.groups = {};
  if (!rec.outbox) rec.outbox = [];
  if (!rec.name) rec.name = name;
  if (rec.avatar === undefined) rec.avatar = '';
  myUid = rec.uid;
  try { storage.setItem(SES_KEY, name); } catch(e) {}
  refreshMyIdentity();
  $('authView').hidden = true;
  $('appView').hidden = false;
  unread = {}; currentChat = null; chatType = 'friend'; conns = {};
  showEmptyChat();
  renderContacts();
  renderStickerGrid();
  setNet('off');
  ensurePeerJS(function(ok){
    if (!ok) { setNet('err'); showToast('无法加载 P2P 组件（PeerJS），请检查网络后刷新', true); return; }
    startPeer();
  });
  /* 离线消息投递探测：每 20 秒尝试把待送达消息推给上线的好友/群主 */
  if (flushTimer) clearInterval(flushTimer);
  flushTimer = setInterval(flushOutbox, 20000);
  setTimeout(flushOutbox, 5000);
}

 $('btnLogout').onclick = function(){
  if (!confirm('退出后下次打开需要重新输入 ID 和密码，确定退出？')) return;
  if (flushTimer) { clearInterval(flushTimer); flushTimer = null; }
  if (peer) { try { peer.destroy(); } catch(e) {} peer = null; }
  try { storage.removeItem(SES_KEY); } catch(e) {}
  me = null;
  $('appView').hidden = true;
  $('authView').hidden = false;
  $('fPass').value = ''; $('fPass2').value = ''; $('fUid').value = ''; $('fUser').value = '';
  setMode(false);
};

 $('btnCopyUid').onclick = function(){ copyText(myUid, '已复制我的 ID：' + myUid); };

/* ═══════════ 个人资料：头像 / 昵称 ═══════════ */
 $('sbMe').onclick = function(){
  var rec = meRec();
  renderBigAvatar($('pmAvatar'), rec.avatar, rec.name || me);
  $('pmName').value = rec.name || me;
  $('pmUid').value = rec.uid;
  $('pmErr').textContent = '';
  openModal('profileModal');
};
function renderBigAvatar(el, url, name){
  el.innerHTML = '';
  if (url) {
    var img = document.createElement('img');
    img.src = url;
    el.appendChild(img);
  } else {
    el.textContent = String(name || '?').charAt(0).toUpperCase();
  }
}
 $('pmAvatar').onclick = function(){ $('avatarFile').click(); };
 $('avatarFile').onchange = function(){
  var f = this.files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { showToast('图片太大，请选 8MB 以内的', true); this.value=''; return; }
  compressImage(f, 96, function(dataUrl, err){
    if (err) { showToast('头像处理失败：' + err, true); return; }
    renderBigAvatar($('pmAvatar'), dataUrl, '');
    $('pmAvatar').dataset.newAvatar = dataUrl;
  });
  this.value = '';
};
 $('btnSaveProfile').onclick = function(){
  var rec = meRec();
  var newName = $('pmName').value.replace(/^\s+|\s+$/g, '');
  if (newName.length < 1) { $('pmErr').textContent = '昵称不能为空'; return; }
  var changed = false;
  if (newName !== rec.name) { rec.name = newName; changed = true; }
  var newAv = $('pmAvatar').dataset.newAvatar || '';
  if (newAv && newAv !== rec.avatar) { rec.avatar = newAv; changed = true; }
  if (!changed) { closeModal('profileModal'); return; }
  saveMe(rec);
  refreshMyIdentity();
  renderContacts();
  if (currentChat) renderMsgs();
  closeModal('profileModal');
  $('pmAvatar').dataset.newAvatar = '';
  /* 把新资料推给所有已连接的人 */
  var profile = { t: 'profile', uid: myUid, name: rec.name, avatar: rec.avatar || '' };
  for (var u in conns) {
    if (conns[u] && conns[u].open) {
      try { conns[u].send(profile); } catch(e) {}
    }
  }
  /* 群成员：把新资料发给所在群的群主，由群主 gsync 同步 */
  var gids = [];
  for (var g in rec.groups) gids.push(g);
  gids.forEach(function(gid){
    var g = rec.groups[gid];
    if (g.owner !== myUid) {
      deliverOrQueue(g.owner, gid, { t: 'profile', uid: myUid, name: rec.name, avatar: rec.avatar || '' }, 0);
    } else {
      /* 我自己是群主：直接更新成员表并广播 */
      updateMyGroupProfiles(gid);
    }
  });
  showToast('资料已保存');
};
function updateMyGroupProfiles(gid){
  var rec = meRec();
  var g = rec.groups[gid];
  if (!g) return;
  for (var i = 0; i < g.members.length; i++) {
    if (g.members[i].uid === myUid) {
      g.members[i].name = rec.name;
      g.members[i].avatar = rec.avatar || '';
    }
  }
  saveMe(rec);
  gsyncGroup(gid);
}

/* ═══════════ PeerJS 加载 ═══════════ */
var PEER_CDNS = [
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
];
function ensurePeerJS(cb){
  if (typeof Peer !== 'undefined') { cb(true); return; }
  var idx = 0;
  function tryNext(){
    if (idx >= PEER_CDNS.length) { cb(false); return; }
    var s = document.createElement('script');
    s.src = PEER_CDNS[idx++];
    s.onload = function(){ cb(typeof Peer !== 'undefined'); };
    s.onerror = function(){ tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
}

/* ═══════════ 信令状态 ═══════════ */
function setNet(state){
  var el = $('netStatus');
  if (!el) return;
  if (state === 'on') {
    el.innerHTML = '<span style="color:var(--green)">● 已连接信令服务器</span>，可加好友 / 收发消息';
  } else if (state === 'err') {
    el.innerHTML = '<span style="color:var(--unread)">● 信令连不上！</span>请换网络（如手机热点）后刷新重试';
  } else {
    el.innerHTML = '<span style="color:#C8A415">● 正在连接信令服务器…</span>';
  }
}

/* ═══════════ Peer 层 ═══════════ */
function peerIdOf(uid){ return 'azchat-u-' + uid.toLowerCase(); }
function peerOpts(){
  return {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
        { urls: 'stun:stun.miwifi.com:3478' },
        { urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp',
          username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:80?transport=tcp',
          username: 'openrelayproject', credential: 'openrelayproject' }
      ],
      iceCandidatePoolSize: 10
    }
  };
}
function startPeer(){
  if (peer) { try { peer.destroy(); } catch(e) {} peer = null; }
  setNet('off');
  var opened = false;
  peer = new Peer(peerIdOf(myUid), peerOpts());
  setTimeout(function(){
    if (!opened) { setNet('err'); showToast('连接信令服务器超时，请检查网络', true); }
  }, 12000);
  peer.on('open', function(){
    opened = true;
    setNet('on');
    updateChatStatus();
  });
  peer.on('connection', bindIncoming);
  peer.on('disconnected', function(){
    setNet('off');
    try { peer.reconnect(); } catch(e) {}
  });
  peer.on('error', function(e){
    var t = e && e.type;
    if (t === 'unavailable-id') {
      showToast('该账号已在其他窗口登录，本窗口以临时身份运行', true);
      peer = new Peer(peerIdOf(myUid) + '-' + randHex(2), peerOpts());
      peer.on('connection', bindIncoming);
      peer.on('disconnected', function(){ try { peer.reconnect(); } catch(e2) {} });
    } else if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') {
      setNet('err');
      setTimeout(function(){
        if (peer && !peer.open && me) { try { peer.reconnect(); } catch(e2) {} }
      }, 30000);
    }
  });
}

/* ═══════════ 统一投递：在线直发，失败进离线队列 ═══════════ */
function deliverOrQueue(toUid, key, payload, msgTs){
  ensureConn(toUid, function(c){
    try { c.send(payload); } catch(e) {}
    markSent(key, msgTs);
  }, function(){
    var rec = meRec();
    rec.outbox.push({ to: toUid, key: key, payload: payload, ts: msgTs || Date.now() });
    if (rec.outbox.length > 200) rec.outbox = rec.outbox.slice(-200);
    saveMe(rec);
  });
}
function markSent(key, ts){
  if (!ts) return;
  var rec = meRec();
  var arr = rec.chats[key];
  if (!arr) return;
  var hit = false;
  for (var i = 0; i < arr.length; i++) {
    if (arr[i].ts === ts && arr[i].pending) { arr[i].pending = false; hit = true; }
  }
  if (hit) { saveMe(rec); if (currentChat === key) renderMsgs(); }
}
/* 周期探测：把离线队列中的消息推给上线的对方 */
function flushOutbox(){
  if (!me || !peer || !peer.open) return;
  var rec = meRec();
  if (!rec.outbox || !rec.outbox.length) return;
  var byTarget = {};
  rec.outbox.forEach(function(item){
    if (!byTarget[item.to]) byTarget[item.to] = [];
    byTarget[item.to].push(item);
  });
  var targets = [];
  for (var t in byTarget) targets.push(t);
  targets.forEach(function(to){
    ensureConn(to, function(c){
      var rec2 = meRec();
      var remain = [];
      (byTarget[to] || []).forEach(function(item){
        try {
          c.send(item.payload);
          markSent(item.key, item.ts);
        } catch(e) { remain.push(item); }
      });
      /* 从队列移除已发送的 */
      var sentSet = {};
      (byTarget[to] || []).forEach(function(item){ sentSet[item.ts] = true; });
      rec2.outbox = rec2.outbox.filter(function(o){
        return !(o.to === to && sentSet[o.ts]);
      });
      saveMe(rec2);
      showToast('离线消息已送达');
    }, null);
  });
}

function bindIncoming(c){
  c.on('data', function(d){
    try { handleData(c, d); }
    catch(e) { showToast('处理消息出错：' + e.message, true); }
  });
  c.on('close', function(){
    for (var u in conns) { if (conns[u] === c) delete conns[u]; }
    updateChatStatus();
  });
}

function handleData(c, d){
  if (!d || typeof d !== 'object' || !d.uid) return;
  var uid = String(d.uid);
  var rec = meRec();
  if (!rec) return;

  /* 好友请求 */
  if (d.t === 'add') { handleAddReq(c, uid, d.name); return; }

  /* 资料更新（昵称/头像） */
  if (d.t === 'profile') {
    var changed = false;
    if (rec.contacts[uid]) {
      if (d.name) { rec.contacts[uid].name = String(d.name).slice(0,16); changed = true; }
      if (typeof d.avatar === 'string') { rec.contacts[uid].avatar = d.avatar; changed = true; }
    }
    /* 我作为群主：更新该成员在群里的资料并广播 */
    for (var gid in rec.groups) {
      var g = rec.groups[gid];
      if (g.owner !== myUid) continue;
      for (var i = 0; i < g.members.length; i++) {
        if (g.members[i].uid === uid) {
          if (d.name) g.members[i].name = String(d.name).slice(0,16);
          if (typeof d.avatar === 'string') g.members[i].avatar = d.avatar;
          changed = true;
        }
      }
    }
    if (changed) {
      saveMe(rec);
      renderContacts();
      if (currentChat) renderMsgs();
      /* 广播最新的群资料 */
      for (var gid2 in rec.groups) {
        if (rec.groups[gid2].owner === myUid) gsyncGroup(gid2);
      }
    }
    return;
  }

  /* 群消息（成员→群主 或 群主→成员） */
  if (d.t === 'gmsg') {
    var g1 = rec.groups[d.gid];
    if (!g1) return;
    var senderIn = false;
    for (var j = 0; j < g1.members.length; j++) {
      if (g1.members[j].uid === uid) { senderIn = true; break; }
    }
    if (!senderIn) return;
    if (typeof d.text === 'string') {
      receiveMsg(d.gid, { w:'them', from:uid, fromName:String(d.name||uid).slice(0,16), text:String(d.text).slice(0,2000), ts:d.ts||Date.now() });
    } else if (typeof d.img === 'string' && d.img.indexOf('data:image/') === 0 && d.img.length <= 500000) {
      receiveMsg(d.gid, { w:'them', from:uid, fromName:String(d.name||uid).slice(0,16), img:d.img, ts:d.ts||Date.now() });
    }
    /* 我是群主：转发给除发送者外的所有成员（不在线的进离线队列） */
    if (g1.owner === myUid && uid !== myUid) {
      g1.members.forEach(function(m){
        if (m.uid === uid || m.uid === myUid) return;
        deliverOrQueue(m.uid, d.gid, { t:'gmsg', uid:uid, name:d.name, text:d.text, img:d.img, gid:d.gid, ts:d.ts }, 0);
      });
    }
    return;
  }

  /* 群状态同步（群主→成员） */
  if (d.t === 'gsync') {
    if (!d.group || !d.group.gid) return;
    var gNew = d.group;
    var meIn = false, myRole = 'member';
    for (var k = 0; k < gNew.members.length; k++) {
      if (gNew.members[k].uid === myUid) { meIn = true; myRole = gNew.members[k].role; break; }
    }
    if (!meIn) {
      /* 被移出群 */
      if (rec.groups[gNew.gid]) {
        delete rec.groups[gNew.gid];
        delete rec.chats[gNew.gid];
        saveMe(rec);
        if (currentChat === gNew.gid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
        renderContacts();
        showToast('你已被移出群聊「' + gNew.name + '」', true);
      }
      return;
    }
    var old = rec.groups[gNew.gid];
    gNew.myRole = myRole;
    rec.groups[gNew.gid] = gNew;
    saveMe(rec);
    if (old && old.name !== gNew.name && currentChat === gNew.gid) {
      $('chName').textContent = gNew.name;
    }
    renderContacts();
    if (currentChat === gNew.gid) updateChatStatus();
    return;
  }

  /* 入群邀请 */
  if (d.t === 'ginvite') {
    if (!d.group || rec.groups[d.group.gid]) return;
    reqQueue.push({ type:'ginvite', c:c, group:d.group, fromName:String(d.name||'').slice(0,16) });
    nextReq();
    return;
  }

  /* 被踢 */
  if (d.t === 'gkick') {
    var g2 = rec.groups[d.gid];
    if (g2) {
      delete rec.groups[d.gid];
      delete rec.chats[d.gid];
      saveMe(rec);
      if (currentChat === d.gid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
      renderContacts();
      showToast('你已被移出群聊「' + g2.name + '」', true);
    }
    try { c.close(); } catch(e2) {}
    return;
  }

  /* 群主收到踢人请求（管理员执行） */
  if (d.t === 'gkickreq') {
    var g3 = rec.groups[d.gid];
    if (!g3 || g3.owner !== myUid) return;
    removeGroupMember(d.gid, uid, '管理员将其移出');
    return;
  }

  /* 成员退群（群主收到） */
  if (d.t === 'gleave') {
    var g4 = rec.groups[d.gid];
    if (!g4 || g4.owner !== myUid) return;
    removeGroupMember(d.gid, uid, '退出了群聊');
    try { c.close(); } catch(e2) {}
    return;
  }

  /* 角色变更通知 */
  if (d.t === 'grole') {
    var g5 = rec.groups[d.gid];
    if (g5) {
      g5.myRole = d.role;
      for (var k2 = 0; k2 < g5.members.length; k2++) {
        if (g5.members[k2].uid === myUid) g5.members[k2].role = d.role;
      }
      saveMe(rec);
      showToast('你在群「' + g5.name + '」中的身份变更为：' + roleLabel(d.role));
    }
    return;
  }

  /* 解散群聊 */
  if (d.t === 'gdisband') {
    var g6 = rec.groups[d.gid];
    if (g6) {
      delete rec.groups[d.gid];
      delete rec.chats[d.gid];
      saveMe(rec);
      if (currentChat === d.gid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
      renderContacts();
      showToast('群聊「' + g6.name + '」已被群主解散', true);
    }
    try { c.close(); } catch(e2) {}
    return;
  }

  /* 删除好友 */
  if (d.t === 'del') {
    if (rec.contacts[uid]) {
      var nm = rec.contacts[uid].name;
      delete rec.contacts[uid];
      delete rec.chats[uid];
      saveMe(rec);
      if (currentChat === uid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
      renderContacts();
      showToast(nm + ' 已将你从好友列表移除', true);
    }
    try { c.close(); } catch(e2) {}
    return;
  }

  /* 单聊：必须好友 */
  if (!rec.contacts[uid]) return;
  if (!conns[uid]) { conns[uid] = c; updateChatStatus(); }
  if (d.t === 'chat' && typeof d.text === 'string') {
    receiveMsg(uid, { w:'them', text:String(d.text).slice(0,2000), ts:d.ts||Date.now() });
  } else if (d.t === 'sticker' && typeof d.img === 'string' && d.img.indexOf('data:image/') === 0) {
    if (d.img.length > 500000) return;
    receiveMsg(uid, { w:'them', img:d.img, ts:d.ts||Date.now() });
  }
}

function sendAddReq(uid){

  var c = peer.connect(peerIdOf(uid), { reliable: true });
  var done = false;
  function finish(){
    if (done) return;
    done = true;
    try { c.close(); } catch(e) {}
  }
  var timer = setTimeout(function(){
    if (!done) {
      showToast('对方不在线或 ID 不存在。对方须在自己设备上注册并保持页面打开', true);
      finish();
    }
  }, 15000);
  c.on('open', function(){

    c.send({ t: 'add', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' });
  });

    clearTimeout(timer); finish();

      var rec = meRec();
      rec.contacts[uid] = { uid: uid, name: String(d.name || uid).slice(0, 16), avatar: d.avatar || '' };
      saveMe(rec);
      renderContacts();
      showToast('已添加 ' + rec.contacts[uid].name);
    } else {
      showToast('对方拒绝了你的好友请求', true);
    }
  });
  c.on('error', function(){
    clearTimeout(timer);
    if (!done) { showToast('连接失败，请稍后重试', true); finish(); }
  });
}

var reqQueue = [], reqShowing = false;
function handleAddReq(c, uid, name){
  var rec = meRec();
  if (rec.contacts[uid]) {
    try { c.send({ t: 'addok', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' }); } catch(e) {}
    return;
  }
  reqQueue.push({ type:'add', c:c, uid:uid, name:String(name || uid).slice(0, 16) });
  nextReq();
}
function nextReq(){
  if (reqShowing || !reqQueue.length) return;
  reqShowing = true;
  var r = reqQueue.shift();

  if (r.type === 'ginvite') {
    $('girText').textContent = '「' + r.fromName + '」邀请你加入群聊「' + r.group.name + '」（' + r.group.members.length + ' 人）。';
    openModal('gInviteReqModal');
    $('girAccept').onclick = function(){
      closeModal('gInviteReqModal');
      var rec = meRec();
      var myRole = 'member';
      for (var i = 0; i < r.group.members.length; i++) {
        if (r.group.members[i].uid === myUid) myRole = r.group.members[i].role;
      }
      r.group.myRole = myRole;
      rec.groups[r.group.gid] = r.group;
      rec.chats[r.group.gid] = rec.chats[r.group.gid] || [];
      saveMe(rec);
      renderContacts();
      try { r.c.send({ t: 'gack', uid: myUid, name: rec.name || me, gid: r.group.gid, avatar: rec.avatar || '' }); } catch(e) {}
      showToast('已加入群聊「' + r.group.name + '」');
      reqShowing = false;
      nextReq();
    };
    $('girReject').onclick = function(){
      closeModal('gInviteReqModal');
      reqShowing = false;
      nextReq();
    };
    return;
  }

  /* 好友请求 */
  $('reqName').textContent = r.name;
  $('reqUid').textContent = r.uid;
  $('reqText').textContent = '「' + r.name + '」请求添加你为好友。';
  var av = $('reqAvatar');
  av.innerHTML = '';
  av.style.background = avatarColor(r.uid);
  av.textContent = r.name.charAt(0).toUpperCase();
  openModal('reqModal');
  $('btnAccept').onclick = function(){
    closeModal('reqModal');
    var rec = meRec();
    rec.contacts[r.uid] = { uid: r.uid, name: r.name, avatar: r.avatar || '' };
    saveMe(rec);
    renderContacts();
    try { r.c.send({ t: 'addok', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' }); } catch(e) {}
    conns[r.uid] = r.c;
    updateChatStatus();
    showToast('已添加 ' + r.name);
    reqShowing = false;
    nextReq();
  };
  $('btnReject').onclick = function(){
    closeModal('reqModal');
    try { r.c.send({ t: 'addno', uid: myUid }); r.c.close(); } catch(e) {}
    reqShowing = false;
    nextReq();
  };
}

/* 群主：同步群状态给所有成员 */
function gsyncGroup(gid){
  var rec = meRec();
  var g = rec.groups[gid];
  if (!g || g.owner !== myUid) return;
  var snapshot = JSON.parse(JSON.stringify(g));
  g.members.forEach(function(m){
    if (m.uid === myUid) return;
    deliverOrQueue(m.uid, gid, { t: 'gsync', uid: myUid, group: snapshot }, 0);
  });
}
/* 群主：移除成员 */
function removeGroupMember(gid, uid, reason){
  var rec = meRec();
  var g = rec.groups[gid];
  if (!g || g.owner !== myUid) return;
  g.members = g.members.filter(function(m){ return m.uid !== uid; });
  saveMe(rec);
  /* 通知被移出者 */
  var kickPayload = { t: 'gkick', uid: myUid, gid: gid };
  ensureConn(uid, function(c){ try { c.send(kickPayload); } catch(e) {} setTimeout(function(){ try { c.close(); } catch(e2) {} }, 500); }, function(){
    rec.outbox.push({ to: uid, key: gid, payload: kickPayload, ts: Date.now() });
    saveMe(rec);
  });
  gsyncGroup(gid);
  renderContacts();
  showToast('已将成员移出（' + reason + '）');
}

function buildBubbleContent(bub, m){
  if (m.img) {
    bub.className += ' has-img';

      $('imgViewer').hidden = false;
    };
    bub.appendChild(img);
    return;
  }
  var text = m.text || '';
  var parts = text.split(URL_RE);
  for (var i = 0; i < parts.length; i++) {
    if (!parts[i]) continue;
    if (i % 2 === 1) {
      var a = document.createElement('a');
      a.className = 'm-link';
      a.textContent = parts[i];
      var href = /^https?:\/\//i.test(parts[i]) ? parts[i] : ('http://' + parts[i]);
      a.onclick = (function(url){ return function(e){
        e.preventDefault();
        openWebview(url);
      }; })(href);
      bub.appendChild(a);
    } else {
      bub.appendChild(document.createTextNode(parts[i]));
    }
  }
}

  saveMe(rec);
  if (currentChat === key) renderMsgs();
  else {

    var preview = msg.img ? '[贴图]' : String(msg.text).slice(0, 20);
    var who = msg.fromName || (rec.contacts[key] ? rec.contacts[key].name : (rec.groups[key] ? rec.groups[key].name : ''));
    showToast(who + '：' + preview);

function ensureConn(uid, cb, onFail){
  var c = conns[uid];
  if (c && c.open) { if (cb) cb(c); return; }
  updateChatStatus();
  if (!peer || !peer.open) {
    showToast('信令未连接（见侧栏状态）', true);
    if (onFail) onFail();
    return;
  }
  var nc = peer.connect(peerIdOf(uid), { reliable: true });
  var opened = false;
  var timer = setTimeout(function(){
    if (!opened) {
      try { nc.close(); } catch(e) {}
      updateChatStatus();
      if (onFail) onFail();
    }
  }, 20000);
  nc.on('open', function(){
    opened = true;
    clearTimeout(timer);
    conns[uid] = nc;
    updateChatStatus();
    /* 连接建立即推送我的最新资料 */
    var rec = meRec();
    try { nc.send({ t: 'profile', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' }); } catch(e) {}
    if (cb) cb(nc);
  });
  nc.on('error', function(){
    clearTimeout(timer);
    updateChatStatus();
    if (onFail) onFail();
  });
  nc.on('close', function(){
    delete conns[uid];
    updateChatStatus();
  });
}

/* 发送文本：单聊直达；群聊发给群主中转；失败进离线队列（⏳） */
function sendMsg(){
  var input = $('msgInput');
  var text = input.value.replace(/^\s+|\s+$/g, '');
  if (!text || !currentChat) return;
  var key = currentChat;
  input.value = '';
  var rec = meRec();
  if (!rec.chats[key]) rec.chats[key] = [];
  var ts = Date.now();
  var msg = { w: 'me', text: text, ts: ts, pending: true };
  rec.chats[key].push(msg);
  if (rec.chats[key].length > 300) rec.chats[key] = rec.chats[key].slice(-300);
  saveMe(rec);
  renderMsgs();

  var payload;
  if (chatType === 'group') {
    var g = rec.groups[key];
    if (!g) return;
    payload = { t: 'gmsg', uid: myUid, name: rec.name || me, text: text, gid: key, ts: ts };
    deliverOrQueue(g.owner, key, payload, ts);
    /* 我是群主：直接转发给所有成员 */
    if (g.owner === myUid) {
      g.members.forEach(function(m){
        if (m.uid === myUid) return;
        deliverOrQueue(m.uid, key, payload, 0);
      });
      markSent(key, ts);
    }
  } else {
    payload = { t: 'chat', uid: myUid, text: text, ts: ts };
    deliverOrQueue(key, key, payload, ts);
  }
}

function compressImage(file, maxPx, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      try {
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxPx / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * scale);
        cv.height = Math.round(h * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        var type = (file.type === 'image/png') ? 'image/png' : 'image/jpeg';
        var out = cv.toDataURL(type, 0.8);
        if (out.length > 500000) {
          out = cv.toDataURL('image/jpeg', 0.5);
          if (out.length > 500000) { cb(null, '压缩后仍过大'); return; }
        }
        cb(out, null);
      } catch(e) { cb(null, e.message); }
    };
    img.onerror = function(){ cb(null, '无法读取该图片'); };
    img.src = reader.result;
  };
  reader.onerror = function(){ cb(null, '读取文件失败'); };
  reader.readAsDataURL(file);
}
function sendSticker(dataUrl){
  if (!currentChat) return;
  var key = currentChat;
  var rec = meRec();
  if (!rec.chats[key]) rec.chats[key] = [];
  var ts = Date.now();
  var msg = { w: 'me', img: dataUrl, ts: ts, pending: true };
  rec.chats[key].push(msg);
  if (rec.chats[key].length > 300) rec.chats[key] = rec.chats[key].slice(-300);
  saveMe(rec);
  renderMsgs();
  hideEmojiPanel();
  if (chatType === 'group') {
    var g = rec.groups[key];
    if (!g) return;
    var payload = { t: 'gmsg', uid: myUid, name: rec.name || me, img: dataUrl, gid: key, ts: ts };
    deliverOrQueue(g.owner, key, payload, ts);
    if (g.owner === myUid) {
      g.members.forEach(function(m){
        if (m.uid === myUid) return;
        deliverOrQueue(m.uid, key, payload, 0);
      });
      markSent(key, ts);
    }
  } else {
    deliverOrQueue(key, key, { t: 'sticker', uid: myUid, img: dataUrl, ts: ts }, ts);
  }
}

/* ═══════════ 备份 / 导入 ═══════════ */
 $('btnBackup').onclick = function(){
  try {
    var data = { app: 'azchat', ver: 2, db: storage.getItem(DB_KEY) };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'azchat-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    showToast('备份文件已开始下载');
  } catch(e) {
    showToast('备份失败：' + e.message, true);
  }
};
 $('btnImport').onclick = function(){ $('importFile').click(); };
 $('importFile').onchange = function(){
  var f = this.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var data = JSON.parse(r.result);
      if (!data || data.app !== 'azchat' || !data.db) { showToast('备份文件格式不正确', true); return; }
      if (!confirm('导入会合并本机数据（同名账号将被备份覆盖），确定继续？')) return;
      var cur = JSON.parse(storage.getItem(DB_KEY) || '{}');
      var back = JSON.parse(data.db);
      var count = 0;
      for (var n in back) {
        if (!back[n].groups) back[n].groups = {};
        if (!back[n].outbox) back[n].outbox = [];
        if (!back[n].name) back[n].name = n;
        cur[n] = back[n];
        count++;
      }
      storage.setItem(DB_KEY, JSON.stringify(cur));
      showToast('导入成功，共 ' + count + ' 个账号');
    } catch(e) {
      showToast('导入失败：' + e.message, true);
    }
  };
  r.readAsText(f);
  this.value = '';
};

if (storageIsMemory) {
  setTimeout(function(){ showToast('当前环境禁止本地存储，无法记住登录状态', true); }, 800);
}
</script>
