<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AzChat · 点对点聊天</title>
<style>
  :root{
    --bg:#F2F2F2; --panel:#FFFFFF; --ink:#191919; --sub:#9A9A9A;
    --line:#E6E6E6; --green:#07C160; --bubble:#95EC69; --chatbg:#EDEDED;
    --unread:#FA5151; --mention:#576B95; --mentionbg:#E8F0FE;
  }
  /* 深色模式 */
  html.dark{
    --bg:#111111; --panel:#1E1E1E; --ink:#E8E8E8; --sub:#8A8A8A;
    --line:#333333; --bubble:#3EB575; --chatbg:#161616;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-size:14px;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;outline:none}
  [hidden]{display:none !important}

  #toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-80px);z-index:600;
    background:#3A3A3A;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .3s;
    pointer-events:none;max-width:88vw;text-align:center;word-break:break-all}
  html.dark #toast{background:#E8E8E8;color:#191919}
  #toast.show{transform:translate(-50%,0)}
  #toast.err{background:#C0392B;color:#fff}

  /* ══ 登录/注册 ══ */
  #authView{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px}
  .logo{width:64px;height:64px;border-radius:16px;background:var(--green);display:flex;
    align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:700}
  .auth-title{font-size:21px;font-weight:600;margin:16px 0 4px}
  .auth-sub{font-size:12.5px;color:var(--sub);margin-bottom:28px}
  .auth-box{width:100%;max-width:330px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px}
  .field input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;font-size:14px;color:var(--ink)}
  .field input:focus{border-color:var(--green)}
  .field input.uid-input{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center}
  .field .hint{font-size:11px;color:var(--sub);margin-top:5px}
  .remember-row{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:13px;color:var(--sub);cursor:pointer;user-select:none}
  .remember-row input{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
  .form-err{color:var(--unread);font-size:12.5px;min-height:20px;margin-bottom:6px}
  .btn-primary{width:100%;background:var(--green);color:#fff;border-radius:8px;padding:13px;
    font-size:15px;font-weight:500}
  .btn-primary:hover{opacity:.9}
  .tabs{display:flex;background:var(--line);border-radius:8px;padding:3px;margin-bottom:22px}
  .tabs button{flex:1;padding:9px;border-radius:6px;font-size:13.5px;color:var(--sub)}
  .tabs button.on{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .auth-note{margin-top:26px;font-size:11.5px;color:var(--sub);text-align:center;line-height:1.9}

  /* ══ 主界面 ══ */
  #appView{height:100%;display:flex}
  #sidebar{width:280px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0}
  .sb-head{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .sb-head:hover{background:rgba(128,128,128,.06)}
  .sb-me-name{font-size:14px;font-weight:600}
  .sb-me-uid{font-size:10.5px;color:var(--sub);font-family:ui-monospace,Menlo,monospace}
  .net-status{padding:0 16px 10px;font-size:12px;color:var(--sub);line-height:1.5}
  .btn-row{display:flex;gap:8px;padding:0 16px 10px}
  .btn-row button{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
    background:var(--green);color:#fff;border-radius:8px;padding:9px 4px;font-size:12.5px;font-weight:500}
  .btn-row button:hover{opacity:.9}
  .sb-label{padding:6px 16px 2px;font-size:11px;color:var(--sub);letter-spacing:.1em}
  #contactList{flex:1;overflow-y:auto;padding-bottom:10px}
  .c-item{display:flex;align-items:center;gap:11px;padding:10px 16px;cursor:pointer;position:relative}
  .c-item:hover{background:rgba(128,128,128,.07)}
  .c-item.on{background:rgba(128,128,128,.12)}
  .avatar{width:42px;height:42px;border-radius:8px;color:#fff;font-size:17px;font-weight:600;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
  .avatar img,.m-avatar img,.big-avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
  .c-info{flex:1;min-width:0}
  .c-name{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-uid{font-size:11px;color:var(--sub);font-family:ui-monospace,Menlo,monospace}
  .c-dot{position:absolute;left:50px;top:10px;min-width:17px;height:17px;border-radius:9px;background:var(--unread);
    color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}
  .c-empty{padding:36px 24px;text-align:center;color:var(--sub);font-size:12.5px;line-height:1.9}
  .sb-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
  .sb-foot button{flex:1;padding:8px 4px;font-size:12.5px;color:var(--sub);border-radius:6px}
  .sb-foot button:hover{background:rgba(128,128,128,.1);color:var(--ink)}

  #chatPane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chatbg)}
  #chatEmpty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--sub)}
  #chatEmpty .logo{opacity:.25}
  .chat-head{padding:13px 20px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px}
  .btn-back{display:none;width:28px;height:28px;color:var(--sub);align-items:center;justify-content:center;font-size:20px}
  .ch-name{font-size:16px;font-weight:600}
  .ch-uid{font-size:11px;color:var(--sub);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
  .ch-status{margin-left:auto;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .btn-more{width:30px;height:30px;color:var(--sub);font-size:18px;display:flex;align-items:center;justify-content:center;border-radius:6px}
  .btn-more:hover{background:rgba(128,128,128,.12);color:var(--ink)}
  .dot{width:7px;height:7px;border-radius:50%;background:#C4C4C4}
  .dot.live{background:var(--green)}
  #msgs{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .t-div{align-self:center;font-size:11.5px;color:var(--sub);background:rgba(128,128,128,.15);border-radius:4px;padding:3px 9px}
  .announce{align-self:stretch;background:rgba(184,134,11,.1);border:1px solid rgba(184,134,11,.35);
    border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.6;color:var(--ink)}
  .announce b{color:#B8860B;display:block;margin-bottom:3px;font-size:12px}
  .m-row{display:flex;gap:10px;max-width:78%;align-items:flex-start;position:relative}
  .m-row.me{flex-direction:row-reverse;align-self:flex-end}
  .m-row.them{align-self:flex-start}
  .m-avatar{width:36px;height:36px;border-radius:6px;color:#fff;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;overflow:hidden;cursor:pointer}
  .m-col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:100%}
  .m-sender{font-size:11px;color:var(--sub);padding:0 4px}
  .m-bubble{padding:10px 13px;border-radius:8px;font-size:14.5px;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;position:relative}
  .m-bubble.has-img{padding:5px;background:var(--panel);white-space:normal}
  .m-bubble.has-audio{padding:12px 14px;min-width:120px}
  .m-bubble img{max-width:160px;max-height:160px;border-radius:5px;display:block;cursor:zoom-in}
  .them .m-bubble{background:var(--panel)}
  html.dark .them .m-bubble{background:#2A2A2A}
  .me .m-bubble{background:var(--bubble);color:#191919}
  html.dark .me .m-bubble{color:#111}
  .me .m-bubble.has-img{background:var(--panel);color:var(--ink)}
  .m-mention{background:var(--mentionbg);color:var(--mention);border-radius:4px;padding:1px 4px;font-weight:500}
  html.dark .m-mention{background:rgba(87,107,149,.25);color:#8FB5F0}
  .m-pending{font-size:10px;color:#C8A415;margin-left:4px}
  .m-read{font-size:10px;color:var(--green);margin-left:4px}
  .m-recalled{font-size:12px;color:var(--sub);font-style:italic}
  .m-audio{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:110px}
  .m-audio .play-ic{font-size:18px;width:22px;text-align:center}
  .m-audio .bar{flex:1;height:26px;display:flex;align-items:center;gap:2px}
  .m-audio .bar i{width:2.5px;background:currentColor;opacity:.65;border-radius:2px;display:block}
  .m-audio .dur{font-size:11px;color:var(--sub);flex-shrink:0}
  .m-audio.playing .play-ic{color:var(--green)}
  .m-recording{color:var(--unread);font-size:13px;display:flex;align-items:center;gap:6px}
  .m-recording .rc-dot{width:9px;height:9px;border-radius:50%;background:var(--unread);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .m-link{color:var(--mention);text-decoration:none;cursor:pointer;word-break:break-all}
  .m-link:hover{text-decoration:underline}

  .composer-wrap{background:var(--panel);border-top:1px solid var(--line)}
  #emojiPanel{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;max-height:220px;overflow-y:auto}
  .ep-tabs{display:flex;gap:16px;margin-bottom:10px;font-size:13px}
  .ep-tabs button{color:var(--sub);padding:2px 4px;border-radius:5px}
  .ep-tabs button.on{color:var(--ink);font-weight:600;background:rgba(128,128,128,.12)}
  .emoji-grid{display:flex;flex-wrap:wrap;gap:2px}
  .emoji-grid button{width:34px;height:34px;font-size:22px;border-radius:6px;line-height:1}
  .emoji-grid button:hover{background:rgba(128,128,128,.12)}
  .sticker-grid{display:flex;flex-wrap:wrap;gap:8px}
  .sticker-grid .stk{width:56px;height:56px;border-radius:8px;background:var(--panel);border:1px solid var(--line);
    padding:3px;cursor:pointer;object-fit:contain}
  .sticker-grid .stk:hover{border-color:var(--green)}
  .sticker-add{width:56px;height:56px;border-radius:8px;border:1px dashed #C4C4C4;color:var(--sub);
    font-size:22px;display:flex;align-items:center;justify-content:center;background:var(--panel)}
  .sticker-add:hover{border-color:var(--green);color:var(--green)}
  /* @ 选择面板 */
  #mentionPanel{position:absolute;bottom:56px;left:60px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:6px;z-index:50;max-height:200px;overflow-y:auto;min-width:180px}
  .mn-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:7px;cursor:pointer;font-size:14px}
  .mn-item:hover{background:rgba(128,128,128,.1)}
  .mn-item .avatar{width:28px;height:28px;font-size:12px}
  .mn-all{color:var(--unread);font-weight:600}
  .composer{display:flex;gap:8px;padding:12px 16px 14px;align-items:center;position:relative}
  .btn-emoji,.btn-mic{width:36px;height:40px;font-size:21px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;flex-shrink:0}
  .btn-emoji:hover,.btn-mic:hover{background:rgba(128,128,128,.12)}
  .btn-emoji.on{background:rgba(128,128,128,.2)}
  .btn-mic.recording{background:var(--unread);color:#fff;animation:blink 1s infinite}
  .composer input{flex:1;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;background:var(--bg);color:var(--ink)}
  .composer input:focus{border-color:var(--green)}
  .btn-send{background:var(--green);color:#fff;border-radius:8px;padding:0 20px;font-size:14px;font-weight:500;
    height:42px;flex-shrink:0}

  #webview{position:fixed;inset:0;background:var(--panel);z-index:500;display:flex;flex-direction:column}
  .wv-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
  .wv-bar button{color:var(--mention);font-size:14px;padding:6px 10px;border-radius:6px}
  .wv-bar button:hover{background:rgba(128,128,128,.12)}
  .wv-title{flex:1;text-align:center;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wv-url{font-size:11px;color:var(--sub);text-align:center;padding:4px;background:rgba(184,134,11,.08);
    font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wv-hint{font-size:11px;color:#B08A2E;text-align:center;padding:4px;background:rgba(184,134,11,.08);line-height:1.5}
  #wvFrame{flex:1;width:100%;border:none;background:var(--panel)}

  #imgViewer{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:550;
    display:flex;align-items:center;justify-content:center;cursor:zoom-out}
  #imgViewer img{max-width:92vw;max-height:88vh;border-radius:8px}

  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;
    align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--panel);border-radius:12px;width:100%;max-width:340px;padding:22px;
    max-height:84vh;overflow-y:auto}
  .modal h3{font-size:16px;margin-bottom:16px;font-weight:600}
  .req-user{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .req-msg{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:18px}
  .modal-btns{display:flex;gap:10px}
  .mbtn{flex:1;padding:11px;border-radius:8px;font-size:14px;font-weight:500}
  .mbtn.gray{background:rgba(128,128,128,.12);color:var(--ink)}
  .mbtn.green{background:var(--green);color:#fff}
  .modal-close{float:right;color:var(--sub);font-size:20px;line-height:1;padding:2px 4px}
  .modal-close:hover{color:var(--ink)}
  .fm-info{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .big-avatar{width:56px;height:56px;border-radius:10px;color:#fff;font-size:22px;font-weight:600;
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
  .fm-item{border-top:1px solid var(--line)}
  .fm-item button{width:100%;text-align:left;padding:12px 4px;font-size:14.5px;color:var(--ink)}
  .fm-item button.danger{color:var(--unread)}
  .fm-item button:hover{background:rgba(128,128,128,.06)}
  .gm-list{margin-bottom:10px}
  .gm-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .gm-item .avatar{width:34px;height:34px;font-size:14px}
  .gm-name{flex:1;font-size:14px}
  .gm-role{font-size:10px;border-radius:4px;padding:1px 6px}
  .role-owner{color:#B8860B;background:rgba(184,134,11,.15)}
  .role-admin{color:var(--mention);background:var(--mentionbg)}
  .role-member{color:var(--sub);background:rgba(128,128,128,.12)}
  .gm-ops{display:flex;gap:6px}
  .gm-ops button{font-size:11px;color:var(--mention);padding:3px 8px;border-radius:5px;background:var(--mentionbg)}
  .gm-ops button:hover{opacity:.8}
  .gm-ops button.danger{color:var(--unread);background:rgba(250,81,81,.1)}
  .pick-list{max-height:220px;overflow-y:auto;margin-bottom:14px;border:1px solid var(--line);border-radius:8px}
  .pick-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .pick-item:last-child{border-bottom:none}
  .pick-item:hover{background:rgba(128,128,128,.06)}
  .pick-item input{width:16px;height:16px;accent-color:var(--green)}
  .pick-item .avatar{width:32px;height:32px;font-size:13px}
  textarea.ann-input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;font-size:13.5px;color:var(--ink);min-height:90px;resize:vertical}

  @media (max-width:680px){
    #sidebar{width:100%;border-right:none}
    #chatPane{position:fixed;inset:0;z-index:10;display:none}
    #chatPane.open{display:flex}
    .btn-back{display:flex}
    .m-row{max-width:88%}
  }
</style>
</head>
<body>

<div id="toast"></div>

<main id="authView" hidden>
  <div class="logo">A</div>
  <div class="auth-title">AzChat</div>
  <div class="auth-sub">点对点加密聊天 · 对方离线也能收到消息</div>
  <div class="auth-box">
    <div class="tabs">
      <button type="button" id="tabLogin" class="on">登录</button>
      <button type="button" id="tabReg">注册</button>
    </div>
    <form id="authForm" novalidate>
      <div class="field" id="fUidWrap">
        <label>AzChat ID</label>
        <input id="fUid" class="uid-input" type="text" placeholder="AZ + 8 位字符" maxlength="10" autocomplete="off">
      </div>
      <div class="field" id="fUserWrap" hidden>
        <label>昵称</label>
        <input id="fUser" type="text" placeholder="2–16 个字符" maxlength="16" autocomplete="off">
        <div class="hint">注册成功后自动分配你的专属 ID</div>
      </div>
      <div class="field">
        <label>密码</label>
        <input id="fPass" type="password" placeholder="至少 6 位">
      </div>
      <div class="field" id="fPass2Wrap" hidden>
        <label>确认密码</label>
        <input id="fPass2" type="password" placeholder="再输入一次">
      </div>
      <label class="remember-row" id="rememberRow">
        <input type="checkbox" id="fRemember" checked>
        记住我，以后打开直接进入
      </label>
      <div class="form-err" id="formErr"></div>
      <button type="submit" class="btn-primary" id="authSubmit">进入</button>
    </form>
  </div>
  <p class="auth-note">在线时 P2P 端到端直连<br>对方离线时消息存入云端信箱，上线即收</p>
</main>

<div id="appView" hidden>
  <aside id="sidebar">
    <div class="sb-head" id="sbMe" title="点击修改头像和昵称">
      <div class="avatar" id="myAvatar" style="background:var(--green)">A</div>
      <div>
        <div class="sb-me-name" id="myName">—</div>
        <div class="sb-me-uid" id="myUidShort">—</div>
      </div>
      <span style="margin-left:auto;color:var(--sub);font-size:12px">✏️</span>
    </div>
    <div class="net-status" id="netStatus">● 正在连接…</div>
    <div class="btn-row">
      <button type="button" id="btnAddFriend">＋ 好友</button>
      <button type="button" id="btnCreateGroup">👥 群聊</button>
    </div>
    <div class="sb-label">消息</div>
    <div id="contactList"></div>
    <div class="sb-foot">
      <button type="button" id="btnTheme">🌙 深色</button>
      <button type="button" id="btnBackup">备份</button>
      <button type="button" id="btnImport">导入</button>
      <button type="button" id="btnLogout">退出</button>
    </div>
  </aside>

  <section id="chatPane">
    <div id="chatEmpty">
      <div class="logo" style="opacity:.25">A</div>
      <div>选择好友或群聊开始聊天</div>
    </div>
    <div id="chatBox" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="chat-head">
        <button type="button" class="btn-back" id="btnBack">‹</button>
        <div>
          <div class="ch-name" id="chName"></div>
          <div class="ch-uid" id="chUid"></div>
        </div>
        <div class="ch-status"><span class="dot" id="chDot"></span><span id="chStatus">未连接</span></div>
        <button type="button" class="btn-more" id="btnMore" title="聊天设置">⋯</button>
      </div>
      <div id="msgs"></div>
      <div class="composer-wrap">
        <div id="mentionPanel" hidden></div>

function sha256(msg){
  function rr(x,n){ return (x>>>n) | (x<<(32-n)); }
  var K = [], H0 = [], pc = 0, n = 2, i, p;
  while (pc < 64) {
    p = true;
    for (i = 2; i*i <= n; i++) { if (n % i === 0) { p = false; break; } }

    for (i = 0; i < 16; i++) w[i] = words[off + i];
    for (i = 16; i < 64; i++) {
      var s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15]>>>3);
      var s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2]>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (i = 0; i < 64; i++) {
      var S1 = rr(e,6)^rr(e,11)^rr(e,25), ch = (e&f)^(~e&g);
      var t1 = (h + S1 + ch + K[i] + w[i]) | 0;

  }

  } catch(e) {

 $('authForm').onsubmit = function(e){

      authBusy = true;
      $('authSubmit').disabled = true;
      $('authSubmit').textContent = '注册中…';
      var salt = randHex(8);
      var uid = 'AZ' + sha256('azchat-id::' + name + salt).slice(0, 8).toUpperCase();
      var rec = { salt: salt, hash: sha256(salt + pass), uid: uid, name: name, avatar: '',
                  contacts: {}, chats: {}, stickers: [], groups: {}, outbox: [] };
      db[name] = rec;
      saveDB(db);
      var finishReg = function(){
        authBusy = false;
        $('authSubmit').disabled = false;
        $('authSubmit').textContent = '注册并获取 ID';
        showToast('注册成功！你的 ID：' + uid);
        enterApp(name);
      };
      initCloud(function(ok){
        if (!ok) {
          showToast('⚠️ 云端不可用，账号仅保存在本机', true);
          finishReg();
          return;
        }
        cloudRegister(rec, function(cerr){
          if (cerr) showToast('⚠️ 云端注册失败：' + cerr, true);
          else showToast('✅ 已同步云端，任何设备凭 ID+密码可登录');
          finishReg();
        });
      });
    } else {
      var m = $('fUid').value.match(/^AZ([0-9A-Z]{8})$/);
      if (!m) { err.textContent = '请输入完整的 ID，格式为 AZ + 8 位字符'; return; }
      var loginUid = 'AZ' + m[1];
      authBusy = true;
      $('authSubmit').disabled = true;
      $('authSubmit').textContent = '登录中…';
      var done = function(){
        authBusy = false;
        $('authSubmit').disabled = false;
        $('authSubmit').textContent = '进入';
      };
      var localName = findNameByUid(loginUid);

      if (localName) {
        var r2 = db[localName];
        if (sha256(r2.salt + pass) !== r2.hash) {
          done();
          err.textContent = '密码错误'; return;
        }
        if ($('fRemember').checked) {
          var enc = encPass(pass);
          if (enc) { r2.remembered = true; r2.encPass = enc; }
          var d2 = loadDB(); d2[localName] = r2; saveDB(d2);
        }
        initCloud(function(ok){
          if (ok) {
            sbClient.from(SB_USERS).select('name,avatar').eq('uid', loginUid).maybeSingle()
              .then(function(res){
                if (!res.error && res.data) {
                  var r3 = loadDB()[localName];
                  var upd = false;
                  if (res.data.name && res.data.name !== r3.name) { r3.name = res.data.name; upd = true; }
                  if (res.data.avatar && res.data.avatar !== r3.avatar) { r3.avatar = res.data.avatar; upd = true; }
                  if (upd) { var dd = loadDB(); dd[localName] = r3; saveDB(dd); }
                }
                done();
                enterApp(localName);
                showToast('欢迎回来，' + (loadDB()[localName].name || localName));
              });
          } else {
            done();
            enterApp(localName);
            showToast('欢迎回来，' + (r2.name || localName));
          }
        });
      } else {
        initCloud(function(ok){
          if (!ok) {
            done();
            err.textContent = '该 ID 未在本机注册过，且云端不可用'; return;
          }
          cloudLogin(loginUid, pass, function(cerr, acct){
            if (cerr) {
              done();
              if (cerr === 'notfound') err.textContent = '该 ID 在本机和云端都不存在，请先注册';
              else err.textContent = '云端查询失败：' + cerr;
              return;
            }
            var baseName = acct.name || loginUid;
            var localKey = baseName;
            var nn = 2;
            while (db[localKey]) { localKey = baseName + '_' + nn; nn++; }
            acct.name = localKey;
            var cur = loadDB();
            cur[localKey] = acct;
            saveDB(cur);
            if ($('fRemember').checked) {
              var enc2 = encPass(pass);
              if (enc2) { acct.remembered = true; acct.encPass = enc2; }
              var cur2 = loadDB(); cur2[localKey] = acct; saveDB(cur2);
            }
            done();
            enterApp(localKey);
            showToast('已从云端找回账号 ☁️');
          });
        });
      }
    }
  } catch(ex) {
    authBusy = false;
    $('authSubmit').disabled = false;
    $('formErr').textContent = '出错了：' + ex.message;
  }
};

/* ═══════════ PeerJS ═══════════ */
var PEER_CDNS = [
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
];
function ensurePeerJS(cb){
  if (typeof Peer !== 'undefined') { cb(true); return; }
  var idx = 0;
  function tryNext(){
    if (idx >= PEER_CDNS.length) { cb(false); return; }
    var s = document.createElement('script');
    s.src = PEER_CDNS[idx++];
    s.onload = function(){ cb(typeof Peer !== 'undefined'); };
    s.onerror = function(){ tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
}

function setNet(state){
  var el = $('netStatus');
  if (!el) return;
  var cloudTag = cloudReady ? ' · ☁️信箱+账号库' : '';
  if (state === 'on') {
    el.innerHTML = '<span style="color:var(--green)">● 已连接</span>' + cloudTag;
  } else if (state === 'err') {
    el.innerHTML = '<span style="color:var(--unread)">● P2P 受限</span>' +
      (cloudReady ? '，☁️ 消息仍可收发' : '，请换网络重试');
  } else {
    el.innerHTML = '<span style="color:#C8A415">● 正在连接…</span>' + cloudTag;
  }
}

function peerIdOf(uid){ return 'azchat-u-' + uid.toLowerCase(); }
function peerOpts(){
  return {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
        { urls: 'stun:stun.miwifi.com:3478' },
        { urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp',
          username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:80?transport=tcp',
          username: 'openrelayproject', credential: 'openrelayproject' }
      ],
      iceCandidatePoolSize: 10
    }
  };
}
function startPeer(){
  if (peer) { try { peer.destroy(); } catch(e) {} peer = null; }
  setNet('off');
  var opened = false;
  peer = new Peer(peerIdOf(myUid), peerOpts());
  setTimeout(function(){
    if (!opened) { setNet('err'); }
  }, 12000);
  peer.on('open', function(){
    opened = true;
    setNet('on');
    updateChatStatus();
    cloudFetch();
  });
  peer.on('connection', bindIncoming);
  peer.on('disconnected', function(){
    setNet('off');
    try { peer.reconnect(); } catch(e) {}
  });
  peer.on('error', function(e){
    var t = e && e.type;
    if (t === 'unavailable-id') {
      showToast('该账号已在其他窗口登录，本窗口以临时身份运行', true);
      peer = new Peer(peerIdOf(myUid) + '-' + randHex(2), peerOpts());
      peer.on('connection', bindIncoming);
      peer.on('disconnected', function(){ try { peer.reconnect(); } catch(e2) {} });
    } else if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') {
      setNet('err');
      setTimeout(function(){
        if (peer && !peer.open && me) { try { peer.reconnect(); } catch(e2) {} }
      }, 30000);
    }
  });
}

/* ═══════════ 统一投递 ═══════════ */
function queueLocal(toUid, key, payload, msgTs){
  var rec = meRec();
  if (!rec) return;
  rec.outbox.push({ to: toUid, key: key, payload: payload, ts: msgTs || Date.now() });
  if (rec.outbox.length > 200) rec.outbox = rec.outbox.slice(-200);
  saveMe(rec);
}
function deliverOrQueue(toUid, key, payload, msgTs){
  ensureConn(toUid, function(c){
    try { c.send(payload); } catch(e) {}
    markSent(key, msgTs);
  }, function(){
    if (cloudReady) {
      cloudSend(toUid, payload, key, msgTs, function(){
        queueLocal(toUid, key, payload, msgTs);
      });
    } else {
      queueLocal(toUid, key, payload, msgTs);
    }
  });
}
function markSent(key, ts){
  if (!ts) return;
  var rec = meRec();
  if (!rec) return;
  var arr = rec.chats[key];
  if (!arr) return;
  var hit = false;
  for (var i = 0; i < arr.length; i++) {
    if (arr[i].ts === ts && arr[i].pending) { arr[i].pending = false; hit = true; }
  }
  if (hit) { saveMe(rec); if (currentChat === key) renderMsgs(); }
}
function flushOutbox(){
  if (!me || !peer || !peer.open) return;
  var rec = meRec();
  if (!rec || !rec.outbox || !rec.outbox.length) return;
  var byTarget = {};
  rec.outbox.forEach(function(item){
    if (!byTarget[item.to]) byTarget[item.to] = [];
    byTarget[item.to].push(item);
  });
  for (var to in byTarget) {
    (function(to){
      ensureConn(to, function(c){
        var items = byTarget[to];
        items.forEach(function(item){
          try {
            c.send(item.payload);
            markSent(item.key, item.ts);
          } catch(e) {}
        });
        var sentSet = {};
        items.forEach(function(item){ sentSet[item.ts] = true; });
        var rec2 = meRec();
        rec2.outbox = rec2.outbox.filter(function(o){
          return !(o.to === to && sentSet[o.ts]);
        });
        saveMe(rec2);
        showToast('离线消息已送达');
      }, null);
    })(to);
  }
}

function bindIncoming(c){
  c.on('data', function(d){
    try { handleData(c, d); }
    catch(e) { showToast('处理消息出错：' + e.message, true); }
  });
  c.on('close', function(){
    for (var u in conns) { if (conns[u] === c) delete conns[u]; }
    updateChatStatus();
  });
}

/* ═══════════ 消息协议处理（含撤回/回执/@/公告/语音） ═══════════ */
function handleData(c, d){
  if (!d || typeof d !== 'object' || !d.uid) return;
  var uid = String(d.uid);
  var rec = meRec();
  if (!rec) return;

  if (d.t === 'add') { handleAddReq(c, uid, d.name, d.avatar); return; }

  /* 已读回执：对方打开聊天窗口时发来 */
  if (d.t === 'read') {
    var rk = d.key;
    if (!rec.chats[rk]) return;
    var lastTs = d.ts || Date.now();
    var ch = false;
    for (var ri = 0; ri < rec.chats[rk].length; ri++) {
      var rm = rec.chats[rk][ri];
      if (rm.w === 'me' && rm.ts <= lastTs && !rm.readBy) { rm.readBy = [uid]; ch = true; }
    }
    if (ch) { saveMe(rec); if (currentChat === rk) renderMsgs(); }
    return;
  }

  /* 撤回 */
  if (d.t === 'recall') {
    var rkey = d.key, rts = d.ts;
    if (rec.chats[rkey]) {
      for (var ci = 0; ci < rec.chats[rkey].length; ci++) {
        var cm = rec.chats[rkey][ci];
        if (cm.ts === rts && cm.w === 'them') {
          delete cm.text; delete cm.img; delete cm.audio;
          cm.recalled = true;
          saveMe(rec);
          if (currentChat === rkey) renderMsgs();
          showToast(displayName(rec, uid, cm.fromName) + ' 撤回了一条消息');
          break;
        }
      }
    }
    return;
  }

  /* 群公告同步 */
  if (d.t === 'gannounce') {
    var ga = rec.groups[d.gid];
    if (ga) {
      ga.announce = d.text || '';
      ga.announceBy = d.annName || '';
      ga.announceTs = Date.now();
      saveMe(rec);
      showToast('📢 群公告已更新：' + String(d.text||'').slice(0,20));
      if (currentChat === d.gid) renderMsgs();
    }
    return;
  }

  /* @提醒（群聊） */
  if (d.t === 'gmention') {
    var gm1 = rec.groups[d.gid];
    if (!gm1) return;
    var mentNames = (d.names || []).join('、');
    showToast('💬 ' + displayName(rec, uid, d.name) + ' 在「' + gm1.name + '」中@了你' +
              (d.all ? '（@所有人）' : ''), true);
    /* @提醒不单独入库，正文 gmsg 随后到达 */
    return;
  }

  if (d.t === 'profile') {
    var changed = false;
    if (rec.contacts[uid]) {
      if (d.name) { rec.contacts[uid].name = String(d.name).slice(0,16); changed = true; }
      if (typeof d.avatar === 'string') { rec.contacts[uid].avatar = d.avatar; changed = true; }
    }
    for (var gid in rec.groups) {
      var g = rec.groups[gid];
      if (g.owner !== myUid) continue;
      for (var i = 0; i < g.members.length; i++) {
        if (g.members[i].uid === uid) {
          if (d.name) g.members[i].name = String(d.name).slice(0,16);
          if (typeof d.avatar === 'string') g.members[i].avatar = d.avatar;
          changed = true;
        }
      }
    }
    if (changed) {
      saveMe(rec);
      renderContacts();
      if (currentChat) renderMsgs();
      for (var gid2 in rec.groups) {
        if (rec.groups[gid2].owner === myUid) gsyncGroup(gid2);
      }
    }
    return;
  }

  if (d.t === 'gmsg') {
    var g1 = rec.groups[d.gid];
    if (!g1) return;
    var senderIn = false;
    for (var j = 0; j < g1.members.length; j++) {
      if (g1.members[j].uid === uid) { senderIn = true; break; }
    }
    if (!senderIn) return;
    if (typeof d.audio === 'string' && d.audio.indexOf('data:audio/') === 0 && d.audio.length <= 1200000) {
      receiveMsg(d.gid, { w:'them', from:uid, fromName:String(d.name||uid).slice(0,16), audio:d.audio, dur:d.dur||0, mentions:d.mentions||[], ts:d.ts||Date.now() });
    } else if (typeof d.text === 'string') {
      receiveMsg(d.gid, { w:'them', from:uid, fromName:String(d.name||uid).slice(0,16), text:String(d.text).slice(0,2000), mentions:d.mentions||[], ts:d.ts||Date.now() });
    } else if (typeof d.img === 'string' && d.img.indexOf('data:image/') === 0 && d.img.length <= 500000) {
      receiveMsg(d.gid, { w:'them', from:uid, fromName:String(d.name||uid).slice(0,16), img:d.img, mentions:d.mentions||[], ts:d.ts||Date.now() });
    }
    if (g1.owner === myUid && uid !== myUid) {
      g1.members.forEach(function(m){
        if (m.uid === uid || m.uid === myUid) return;
        deliverOrQueue(m.uid, d.gid, { t:'gmsg', uid:uid, name:d.name, text:d.text, img:d.img, audio:d.audio, dur:d.dur, mentions:d.mentions, gid:d.gid, ts:d.ts }, 0);
      });
    }
    return;
  }

  if (d.t === 'gsync') {
    if (!d.group || !d.group.gid) return;
    var gNew = d.group;
    var meIn = false, myRole = 'member';
    for (var k = 0; k < gNew.members.length; k++) {
      if (gNew.members[k].uid === myUid) { meIn = true; myRole = gNew.members[k].role; break; }
    }
    if (!meIn) {
      if (rec.groups[gNew.gid]) {
        delete rec.groups[gNew.gid];
        delete rec.chats[gNew.gid];
        saveMe(rec);
        if (currentChat === gNew.gid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
        renderContacts();
        showToast('你已被移出群聊「' + gNew.name + '」', true);
      }
      return;
    }
    gNew.myRole = myRole;
    rec.groups[gNew.gid] = gNew;
    saveMe(rec);
    renderContacts();
    if (currentChat === gNew.gid) {
      $('chName').textContent = gNew.name;
      $('chUid').textContent = '群聊 · ' + gNew.members.length + ' 位成员';
      updateChatStatus();
    }
    return;
  }

  if (d.t === 'ginvite') {
    if (c === dummyConn) return;
    if (!d.group || rec.groups[d.group.gid]) return;
    reqQueue.push({ type:'ginvite', c:c, group:d.group, fromName:String(d.name||'').slice(0,16) });
    nextReq();
    return;
  }

  if (d.t === 'gkick') {
    var g2 = rec.groups[d.gid];
    if (g2) {
      delete rec.groups[d.gid];
      delete rec.chats[d.gid];
      saveMe(rec);
      if (currentChat === d.gid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
      renderContacts();
      showToast('你已被移出群聊「' + g2.name + '」', true);
    }
    if (c !== dummyConn) { try { c.close(); } catch(e2) {} }
    return;
  }

  if (d.t === 'gkickreq') {
    var g3 = rec.groups[d.gid];
    if (!g3 || g3.owner !== myUid) return;
    removeGroupMember(d.gid, uid, '管理员移出');
    return;
  }

  if (d.t === 'gleave') {
    var g4 = rec.groups[d.gid];
    if (!g4 || g4.owner !== myUid) return;
    var leaverName = '';
    for (var li = 0; li < g4.members.length; li++) {
      if (g4.members[li].uid === uid) { leaverName = g4.members[li].name; break; }
    }
    removeGroupMember(d.gid, uid, '退出群聊');
    receiveMsg(d.gid, { w:'them', from:'sys', sysText:(leaverName||'有人') + ' 退出了群聊', ts:Date.now() });
    if (c !== dummyConn) { try { c.close(); } catch(e2) {} }
    return;
  }

  if (d.t === 'grole') {
    var g5 = rec.groups[d.gid];
    if (g5) {
      g5.myRole = d.role;
      for (var k2 = 0; k2 < g5.members.length; k2++) {
        if (g5.members[k2].uid === myUid) g5.members[k2].role = d.role;
      }
      saveMe(rec);
      showToast('你在群「' + g5.name + '」中的身份变更为：' + roleLabel(d.role));
    }
    return;
  }

  if (d.t === 'gdisband') {
    var g6 = rec.groups[d.gid];
    if (g6) {
      delete rec.groups[d.gid];
      delete rec.chats[d.gid];
      saveMe(rec);
      if (currentChat === d.gid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
      renderContacts();
      showToast('群聊「' + g6.name + '」已被群主解散', true);
    }
    if (c !== dummyConn) { try { c.close(); } catch(e2) {} }
    return;
  }

  if (d.t === 'del') {
    if (rec.contacts[uid]) {
      var nm = displayName(rec, uid, rec.contacts[uid].name);
      delete rec.contacts[uid];
      delete rec.chats[uid];
      saveMe(rec);
      if (currentChat === uid) { $('chatPane').className=''; currentChat=null; showEmptyChat(); }
      renderContacts();
      showToast(nm + ' 已将你从好友列表移除', true);
    }
    if (c !== dummyConn) { try { c.close(); } catch(e2) {} }
    return;
  }

  if (!rec.contacts[uid]) return;
  if (c !== dummyConn && !conns[uid]) { conns[uid] = c; updateChatStatus(); }
  if (d.t === 'chat' && typeof d.text === 'string') {
    receiveMsg(uid, { w:'them', text:String(d.text).slice(0,2000), ts:d.ts||Date.now() });
  } else if (d.t === 'sticker' && typeof d.img === 'string' && d.img.indexOf('data:image/') === 0) {
    if (d.img.length > 500000) return;
    receiveMsg(uid, { w:'them', img:d.img, ts:d.ts||Date.now() });
  } else if (d.t === 'audio' && typeof d.audio === 'string' && d.audio.indexOf('data:audio/') === 0) {
    if (d.audio.length > 1200000) return;
    receiveMsg(uid, { w:'them', audio:d.audio, dur:d.dur||0, ts:d.ts||Date.now() });
  }
}

 $('btnAddFriend').onclick = function(){
  $('addErr').textContent = '';
  $('addInput').value = '';

    showToast('P2P 未连接，加好友需要双方在线', true);
    return;
  }

};
 $('addInput').oninput = function(e){
  var v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (v.slice(0,2) === 'AZ') v = v.slice(2);
  v = v.slice(0, 8);
  e.target.value = v ? 'AZ' + v : '';
};
 $('btnDoAdd').onclick = function(){
  var err = $('addErr');
  var m = $('addInput').value.match(/^AZ([0-9A-Z]{8})$/);
  if (!m) { err.textContent = 'ID 格式不正确，应为 AZ + 8 位字符'; return; }
  var uid = 'AZ' + m[1];
  if (uid === myUid) { err.textContent = '这是你自己的 ID 呀'; return; }
  if (meRec().contacts[uid]) { err.textContent = '对方已在你的好友列表中'; return; }
  if (!peer || !peer.open) { err.textContent = 'P2P 未连接，无法发起'; return; }
  err.textContent = '';
  closeModal('addModal');
  sendAddReq(uid);

function sendAddReq(uid){
  showToast('正在寻找对方…（最多等 15 秒）');
  var c = peer.connect(peerIdOf(uid), { reliable: true });
  var done = false;
  function finish(){
    if (done) return;
    done = true;
    try { c.close(); } catch(e) {}
  }
  var timer = setTimeout(function(){
    if (!done) {
      showToast('对方不在线或 ID 不存在。加好友需双方同时在线', true);
      finish();
    }
  }, 15000);
  c.on('open', function(){
    var rec = meRec();
    c.send({ t: 'add', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' });
  });
  c.on('data', function(d){
    clearTimeout(timer); finish();
    if (d && d.t === 'addok') {
      var rec = meRec();
      rec.contacts[uid] = { uid: uid, name: String(d.name || uid).slice(0, 16), avatar: d.avatar || '', remark: '' };
      saveMe(rec);
      renderContacts();
      showToast('已添加 ' + rec.contacts[uid].name);
    } else {
      showToast('对方拒绝了你的好友请求', true);
    }
  });
  c.on('error', function(){
    clearTimeout(timer);
    if (!done) { showToast('连接失败，请稍后重试', true); finish(); }
  });
}

var reqQueue = [], reqShowing = false;
function handleAddReq(c, uid, name, avatar){
  var rec = meRec();
  if (c === dummyConn) return;
  if (rec.contacts[uid]) {
    try { c.send({ t: 'addok', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' }); } catch(e) {}
    return;
  }
  reqQueue.push({ type:'add', c:c, uid:uid, name:String(name || uid).slice(0, 16), avatar: avatar || '' });
  nextReq();
}
function nextReq(){
  if (reqShowing || !reqQueue.length) return;
  reqShowing = true;
  var r = reqQueue.shift();

  if (r.type === 'ginvite') {
    $('girText').textContent = '「' + r.fromName + '」邀请你加入群聊「' + r.group.name + '」（' + r.group.members.length + ' 人）。';
    openModal('gInviteReqModal');
    $('girAccept').onclick = function(){
      closeModal('gInviteReqModal');
      var rec = meRec();
      var myRole = 'member';
      for (var i = 0; i < r.group.members.length; i++) {
        if (r.group.members[i].uid === myUid) myRole = r.group.members[i].role;
      }
      r.group.myRole = myRole;
      rec.groups[r.group.gid] = r.group;
      rec.chats[r.group.gid] = rec.chats[r.group.gid] || [];
      saveMe(rec);
      renderContacts();
      try { r.c.send({ t: 'gack', uid: myUid, name: rec.name || me, gid: r.group.gid, avatar: rec.avatar || '' }); } catch(e) {}
      showToast('已加入群聊「' + r.group.name + '」');
      reqShowing = false;
      nextReq();
    };
    $('girReject').onclick = function(){
      closeModal('gInviteReqModal');
      reqShowing = false;
      nextReq();
    };
    return;
  }

  $('reqName').textContent = r.name;
  $('reqUid').textContent = r.uid;
  $('reqText').textContent = '「' + r.name + '」请求添加你为好友。';
  var av = $('reqAvatar');
  av.innerHTML = '';
  av.style.background = avatarColor(r.uid);
  if (r.avatar) {
    var img = document.createElement('img');
    img.src = r.avatar;
    av.appendChild(img);
  } else {
    av.textContent = r.name.charAt(0).toUpperCase();
  }
  openModal('reqModal');
  $('btnAccept').onclick = function(){
    closeModal('reqModal');
    var rec = meRec();
    rec.contacts[r.uid] = { uid: r.uid, name: r.name, avatar: r.avatar || '', remark: '' };
    saveMe(rec);
    renderContacts();
    try { r.c.send({ t: 'addok', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' }); } catch(e) {}
    conns[r.uid] = r.c;
    updateChatStatus();
    showToast('已添加 ' + r.name);
    reqShowing = false;
    nextReq();
  };
  $('btnReject').onclick = function(){
    closeModal('reqModal');
    try { r.c.send({ t: 'addno', uid: myUid }); r.c.close(); } catch(e) {}
    reqShowing = false;
    nextReq();
  };
}

var inviteGid = null;
 $('btnGroupInvite').onclick = function(){
  if (!currentChat || !isGroupKey(currentChat)) return;
  var g = meRec().groups[currentChat];
  if (g.owner !== myUid) { showToast('只有群主可以邀请好友进群', true); return; }
  inviteGid = currentChat;
  var box = $('giList');
  box.innerHTML = '';
  $('giErr').textContent = '';
  $('giHint').textContent = '勾选要邀请的好友（对方需在线）：';
  var rec = meRec();
  var any = false;
  for (var uid in rec.contacts) {
    var f = rec.contacts[uid];
    var already = false;
    for (var i = 0; i < g.members.length; i++) {
      if (g.members[i].uid === uid) { already = true; break; }
    }
    if (already) continue;
    any = true;
    var item = document.createElement('label');
    item.className = 'pick-item';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = uid;

  if (!any) box.innerHTML = '<div style="padding:16px;text-align:center;color:var(--sub);font-size:12.5px">所有好友都已在群里</div>';

};
 $('btnDoInvite').onclick = function(){
  if (!inviteGid) return;
  var rec = meRec();
  var g = rec.groups[inviteGid];
  if (!g) return;
  var picked = [];
  var boxes = $('giList').querySelectorAll('input[type=checkbox]:checked');
  for (var i = 0; i < boxes.length; i++) picked.push(boxes[i].value);
  if (!picked.length) { $('giErr').textContent = '请先勾选好友'; return; }
  closeModal('groupInviteModal');
  var invited = 0, failed = 0;
  picked.forEach(function(uid){
    var c = peer.connect(peerIdOf(uid), { reliable: true });
    var done = false;
    function finish(){ if (!done) { done = true; try { c.close(); } catch(e) {} } }
    function checkDone(){
      if (invited + failed === picked.length) {
        showToast('邀请完成：成功 ' + invited + ' 人' + (failed ? ('，' + failed + ' 人不在线未收到') : ''));
      }
    }
    var timer = setTimeout(function(){
      if (!done) { failed++; finish(); checkDone(); }
    }, 15000);
    c.on('open', function(){
      var snapshot = JSON.parse(JSON.stringify(g));
      c.send({ t: 'ginvite', uid: myUid, name: rec.name || me, group: snapshot });
    });
    c.on('data', function(d){
      clearTimeout(timer); finish();
      if (d && d.t === 'gack' && d.gid === inviteGid) {
        g.members.push({ uid: uid, name: String(d.name||uid).slice(0,16), role: 'member', avatar: d.avatar || '' });
        saveMe(rec);
        gsyncGroup(inviteGid);
        renderContacts();
        invited++;
      } else {
        failed++;
      }
      checkDone();
    });
    c.on('error', function(){ clearTimeout(timer); if (!done) { failed++; finish(); checkDone(); } });
  });
};

function gsyncGroup(gid){
  var rec = meRec();
  var g = rec.groups[gid];
  if (!g || g.owner !== myUid) return;
  var snapshot = JSON.parse(JSON.stringify(g));
  g.members.forEach(function(m){
    if (m.uid === myUid) return;
    deliverOrQueue(m.uid, gid, { t: 'gsync', uid: myUid, group: snapshot }, 0);
  });
}
function removeGroupMember(gid, uid, reason){
  var rec = meRec();
  var g = rec.groups[gid];
  if (!g || g.owner !== myUid) return;
  g.members = g.members.filter(function(m){ return m.uid !== uid; });
  saveMe(rec);
  var kickPayload = { t: 'gkick', uid: myUid, gid: gid };
  ensureConn(uid, function(c){ try { c.send(kickPayload); } catch(e) {} setTimeout(function(){ try { c.close(); } catch(e2) {} }, 500); }, function(){
    deliverOrQueue(uid, gid, kickPayload, 0);
  });
  gsyncGroup(gid);
  renderContacts();
  showToast('已将成员移出（' + reason + '）');
}

/* 气泡内容渲染（文本/@/图片/语音/撤回） */
function buildBubbleContent(bub, m, isMe){
  if (m.recalled) {
    bub.className = 'm-bubble m-recalled';
    bub.textContent = isMe ? '你撤回了一条消息' : '对方撤回了一条消息';
    return;
  }
  if (m.audio) {
    bub.className += ' has-audio';
    bub.appendChild(buildAudioEl(m, isMe));
    return;
  }
  if (m.img) {
    bub.className += ' has-img';
    var img = document.createElement('img');
    img.src = m.img;
    img.alt = '贴图';
    img.onclick = function(e){
      e.stopPropagation();
      $('imgViewerSrc').src = m.img;
      $('imgViewer').hidden = false;
    };
    bub.appendChild(img);
    return;
  }
  var text = m.text || '';
  /* 渲染 @标记：[[mn:AZxxxx:名字]] */
  var MN_RE = /\[\[mn:([A-Z0-9]+):([^\]]*)\]\]/g;
  var lastIdx = 0, mm;
  var parts = [];
  while ((mm = MN_RE.exec(text)) !== null) {
    if (mm.index > lastIdx) parts.push({ plain: text.slice(lastIdx, mm.index) });
    parts.push({ mention: mm[2] });
    lastIdx = mm.index + mm[0].length;
  }
  if (lastIdx < text.length) parts.push({ plain: text.slice(lastIdx) });
  parts.forEach(function(p){
    if (p.mention) {
      var sp = document.createElement('span');
      sp.className = 'm-mention';
      sp.textContent = '@' + p.mention;
      bub.appendChild(sp);
      return;
    }
    var seg = p.plain;
    var urlParts = seg.split(URL_RE);
    for (var i = 0; i < urlParts.length; i++) {
      if (!urlParts[i]) continue;
      if (i % 2 === 1) {
        var a = document.createElement('a');
        a.className = 'm-link';
        a.textContent = urlParts[i];
        var href = /^https?:\/\//i.test(urlParts[i]) ? urlParts[i] : ('http://' + urlParts[i]);
        a.onclick = (function(url){ return function(e){
          e.preventDefault();
          openWebview(url);
        }; })(href);
        bub.appendChild(a);
      } else {
        bub.appendChild(document.createTextNode(urlParts[i]));
      }
    }
  });
}

/* 语音条播放器 */
var audioPlayer = null;
function buildAudioEl(m, isMe){
  var wrap = document.createElement('div');
  wrap.className = 'm-audio';
  var ic = document.createElement('span');
  ic.className = 'play-ic';
  ic.textContent = '▶';
  var bar = document.createElement('span');
  bar.className = 'bar';
  /* 伪波形：随机但固定的高度 */
  var seed = m.ts || 0;
  for (var i = 0; i < 18; i++) {
    var b = document.createElement('i');
    var h = 6 + ((seed * (i + 7)) % 17);
    b.style.height = h + 'px';
    bar.appendChild(b);
  }
  var dur = document.createElement('span');
  dur.className = 'dur';
  dur.textContent = (m.dur || 0) + '"';
  wrap.appendChild(ic); wrap.appendChild(bar); wrap.appendChild(dur);
  wrap.onclick = function(e){
    e.stopPropagation();
    if (audioPlayer) { try { audioPlayer.pause(); } catch(er) {} }
    if (audioPlayer && audioPlayer._src === m.audio && !audioPlayer.paused) {
      audioPlayer = null;
      return;
    }
    try {
      var au = new Audio(m.audio);
      audioPlayer = au;
      au._src = m.audio;
      wrap.classList.add('playing');
      ic.textContent = '⏸';
      au.onended = au.onpause = function(){
        wrap.classList.remove('playing');
        ic.textContent = '▶';
      };
      au.play();
    } catch(er) {
      showToast('播放失败：' + er.message, true);
    }
  };
  return wrap;
}

/* 撤回自己的消息 */
function recallMsg(m){
  if (!currentChat) return;
  if (!confirm('撤回这条消息？（双方都会删除）')) return;
  var rec = meRec();
  var key = currentChat;
  var payload = { t: 'recall', uid: myUid, key: key, ts: m.ts };
  if (chatType === 'friend') {
    deliverOrQueue(key, key, payload, 0);
  } else {
    var g = rec.groups[key];
    if (!g) return;
    if (g.owner === myUid) {
      g.members.forEach(function(mm){
        if (mm.uid === myUid) return;
        deliverOrQueue(mm.uid, key, payload, 0);
      });
    } else {
      deliverOrQueue(g.owner, key, payload, 0);
    }
  }
  delete m.text; delete m.img; delete m.audio;
  m.recalled = true;
  saveMe(rec);
  renderMsgs();
  showToast('已撤回');
}

var _origHandleRecall = null;

  if (!currentChat) return;
  if (chatType === 'group') {

function receiveMsg(key, msg){
  var rec = meRec();
  if (!rec) return;
  if (!rec.chats[key]) rec.chats[key] = [];
  /* 收到群消息且我被@：额外提醒 */
  if (msg.w === 'them' && msg.mentions && msg.mentions.length && rec.groups[key]) {
    var mentioned = msg.mentions.some(function(mn){ return mn.uid === myUid; }) ||
                    msg.mentions.some(function(mn){ return mn.all; });
    if (mentioned) {
      var gname = rec.groups[key].name;
      showToast('💬 ' + (msg.fromName||'有人') + ' 在「' + gname + '」@了你' +
        (msg.mentions.some(function(mn){return mn.all;}) ? '（@所有人）' : ''), true);
      unread[key] = (unread[key] || 0) + 1;
      renderContacts();
    }
  }
  if (!rec.chats[key]) rec.chats[key] = [];
  rec.chats[key].push(msg);
  if (rec.chats[key].length > 300) rec.chats[key] = rec.chats[key].slice(-300);
  saveMe(rec);
  if (currentChat === key) {
    renderMsgs();
    /* 打开着窗口 = 已读，回执 */
    if (chatType === 'friend' && msg.w === 'them') {
      sendReadReceipt(key, msg.ts);
    }
  } else {
    if (!(msg.mentions && msg.mentions.length)) {
      unread[key] = (unread[key] || 0) + 1;
    }
    var preview = msg.sysText ? msg.sysText.slice(0,20) :
                  msg.audio ? '[语音]' :
                  msg.img ? '[贴图]' : String(msg.text || '').replace(/\[\[mn:[^\]]+\]\]/g, '@').slice(0, 20);
    var who = msg.fromName || (rec.contacts[key] ? displayName(rec, key, rec.contacts[key].name) : (rec.groups[key] ? rec.groups[key].name : ''));
    if (who) showToast(who + '：' + preview);
  }
  renderContacts();
}

function ensureConn(uid, cb, onFail){
  var c = conns[uid];
  if (c && c.open) { if (cb) cb(c); return; }
  updateChatStatus();
  if (!peer || !peer.open) {
    if (onFail) onFail();
    return;
  }
  var nc = peer.connect(peerIdOf(uid), { reliable: true });
  var opened = false;
  var timer = setTimeout(function(){
    if (!opened) {
      try { nc.close(); } catch(e) {}
      updateChatStatus();
      if (onFail) onFail();
    }
  }, 15000);
  nc.on('open', function(){
    opened = true;
    clearTimeout(timer);
    conns[uid] = nc;
    updateChatStatus();
    var rec = meRec();
    try { nc.send({ t: 'profile', uid: myUid, name: rec.name || me, avatar: rec.avatar || '' }); } catch(e) {}
    if (cb) cb(nc);
  });
  nc.on('error', function(){
    clearTimeout(timer);
    updateChatStatus();
    if (onFail) onFail();
  });
  nc.on('close', function(){
    delete conns[uid];
    updateChatStatus();
  });
}

function startRecording(){
  if (mediaRecorder || !MIC_OK || !currentChat) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast('此浏览器不支持录音', true);
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    try {
      audioChunks = [];
      var opts = {};
      if (MediaRecorder.isTypeSupported('audio/webm')) opts.mimeType = 'audio/webm';
      else if (MediaRecorder.isTypeSupported('audio/mp4')) opts.mimeType = 'audio/mp4';
      mediaRecorder = new MediaRecorder(stream, opts);
      recStartTs = Date.now();
      mediaRecorder.ondataavailable = function(e){
        if (e.data && e.data.size) audioChunks.push(e.data);
      };
      mediaRecorder.onstop = function(){
        stream.getTracks().forEach(function(t){ try { t.stop(); } catch(e2) {} });
        var dur = Math.round((Date.now() - recStartTs) / 1000);
        var btn = $('btnMic');
        btn.classList.remove('recording');
        btn.textContent = '🎤';
        if (recTimerInt) { clearInterval(recTimerInt); recTimerInt = null; }
        if (dur < 1) { showToast('说话时间太短'); mediaRecorder = null; return; }
        var blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        mediaRecorder = null;
        if (dur > 60) { showToast('语音超过 60 秒，已取消（长按录音最长 60 秒）', true); return; }
        var reader = new FileReader();
        reader.onload = function(){
          var dataUrl = reader.result;
          if (dataUrl.length > 1200000) { showToast('语音过大，发送失败', true); return; }
          sendAudio(dataUrl, dur);
        };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start();
      $('btnMic').classList.add('recording');
      var sec = 0;
      $('btnMic').textContent = '0"';
      recTimerInt = setInterval(function(){
        sec++;
        $('btnMic').textContent = sec + '"';
        if (sec >= 60) stopRecording();
      }, 1000);
      showToast('🎙 松开发送，最长 60 秒');
    } catch(e) {
      stream.getTracks().forEach(function(t){ try { t.stop(); } catch(e2) {} });
      showToast('录音启动失败：' + e.message, true);
      mediaRecorder = null;
    }
  }).catch(function(err){
    mediaRecorder = null;
    showToast('麦克风权限被拒绝，无法录音', true);
  });
}
function stopRecording(){
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    try { mediaRecorder.stop(); } catch(e) {}
  }
}
function sendAudio(dataUrl, dur){
  if (!currentChat) return;
  var key = currentChat;
  var rec = meRec();
  if (!rec.chats[key]) rec.chats[key] = [];
  var ts = Date.now();
  var msg = { w: 'me', audio: dataUrl, dur: dur, ts: ts, pending: true };
  rec.chats[key].push(msg);
  if (rec.chats[key].length > 300) rec.chats[key] = rec.chats[key].slice(-300);
  saveMe(rec);
  renderMsgs();
  if (chatType === 'group') {
    var g = rec.groups[key];
    if (!g) return;
    var payload = { t: 'gmsg', uid: myUid, name: rec.name || me, audio: dataUrl, dur: dur, gid: key, ts: ts };
    deliverOrQueue(g.owner, key, payload, ts);
    if (g.owner === myUid) {
      g.members.forEach(function(m){
        if (m.uid === myUid) return;
        deliverOrQueue(m.uid, key, payload, 0);
      });
      markSent(key, ts);
    }
  } else {
    deliverOrQueue(key, key, { t: 'audio', uid: myUid, audio: dataUrl, dur: dur, ts: ts }, ts);
  }
}

/* ═══════════ 发送消息（含 @ 与回执触发） ═══════════ */
function sendMsg(){
  var input = $('msgInput');
  var text = input.value.replace(/^\s+|\s+$/g, '');
  if (!text || !currentChat) return;
  var key = currentChat;
  input.value = '';
  var rec = meRec();
  if (!rec.chats[key]) rec.chats[key] = [];
  var ts = Date.now();

  /* 组装 @ 数据：pendingMentions 里的目标 */
  var mentions = [];
  var mentionsOut = [];
  if (chatType === 'group' && pendingMentions.length) {
    pendingMentions.forEach(function(mn){
      mentions.push({ uid: mn.uid || '', all: !!mn.all, name: mn.name });
      mentionsOut.push(mn);
    });
    pendingMentions = [];
  }

  var msg = { w: 'me', text: text, ts: ts, pending: true, mentions: mentions };
  rec.chats[key].push(msg);
  if (rec.chats[key].length > 300) rec.chats[key] = rec.chats[key].slice(-300);
  saveMe(rec);
  renderMsgs();

  if (chatType === 'group') {
    var g = rec.groups[key];
    if (!g) return;
    var payload = { t: 'gmsg', uid: myUid, name: rec.name || me, text: text, gid: key, ts: ts, mentions: mentions };
    deliverOrQueue(g.owner, key, payload, ts);
    /* @提醒单独推送（确保被@者有醒目提示） */
    mentionsOut.forEach(function(mn){
      if (mn.all) {
        /* @所有人：发全体 */
        g.members.forEach(function(m){
          if (m.uid === myUid) return;
          deliverOrQueue(m.uid, key, { t: 'gmention', uid: myUid, name: rec.name || me, gid: key, names: [], all: true }, 0);
        });
      } else if (mn.uid) {
        deliverOrQueue(mn.uid, key, { t: 'gmention', uid: myUid, name: rec.name || me, gid: key, names: [mn.name], all: false }, 0);
      }
    });
    if (g.owner === myUid) {
      g.members.forEach(function(m){
        if (m.uid === myUid) return;
        deliverOrQueue(m.uid, key, payload, 0);
      });
      markSent(key, ts);
    }
  } else {
    deliverOrQueue(key, key, { t: 'chat', uid: myUid, text: text, ts: ts }, ts);
  }
}
 $('btnSend').onclick = sendMsg;
 $('msgInput').onkeydown = function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
};

/* ═══════════ 表情 & 贴图 ═══════════ */
var EMOJIS = ('😀 😃 😄 😁 😆 😅 🤣 😂 🙂 😉 😊 😇 🥰 😍 🤩 😘 😗 😚 😋 😜 🤪 🤗 🤔 🤨 😐 😑 😶 🙄 😏 😣 😥 😮 😯 😴 😌 😔 😕 🙃 😲 ☹️ 🙁 😖 😞 😟 😤 😢 😭 😦 😧 😨 😩 🤯 😬 😰 😱 🥵 😳 🤢 🤮 😷 🤒 🤕 🤑 🤠 👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👏 🙌 🤝 💪 🙏 ❤️ 💔 💯 💢 💥 💧 ✨ 🎉 🎁 🌹 🍉 🍓 🍺 ☕ 🐶 🐱 🐼 🌙 ⭐ 🔥 ⚡ 🌈').split(/\s+/);
var epTab = 'emoji';

function hideEmojiPanel(){

 $('btnEmoji').onclick = function(){

 $('epTabEmoji').onclick = function(){ setEpTab('emoji'); };

(function(){
  var grid = $('epEmoji');
  EMOJIS.forEach(function(em){

function renderStickerGrid(){
  var grid = $('epSticker');
  grid.innerHTML = '';
  var rec = meRec();
  if (!rec) return;
  var stickers = rec.stickers || [];
  stickers.forEach(function(dataUrl, idx){
    var img = document.createElement('img');
    img.className = 'stk';
    img.src = dataUrl;
    img.title = '点击发送 / 右键删除';
    img.oncontextmenu = function(e){
      e.preventDefault();
      if (confirm('从贴图收藏中删除这张？')) {
        rec.stickers.splice(idx, 1);
        saveMe(rec);
        renderStickerGrid();
      }
    };
    img.onclick = function(){ sendSticker(dataUrl); };
    grid.appendChild(img);
  });
  var add = document.createElement('button');
  add.type = 'button';
  add.className = 'sticker-add';
  add.textContent = '＋';
  add.title = '添加贴图（右键贴图可删除）';
  add.onclick = function(){ $('stickerFile').click(); };
  grid.appendChild(add);
}
 $('stickerFile').onchange = function(){
  var f = this.files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { showToast('图片太大，请选 8MB 以内', true); this.value=''; return; }
  compressImage(f, 240, function(dataUrl, err){
    if (err) { showToast('图片处理失败：' + err, true); return; }
    var rec = meRec();
    if (!rec.stickers) rec.stickers = [];
    if (rec.stickers.length >= 18) { showToast('贴图收藏已满（18 张）', true); return; }
    rec.stickers.push(dataUrl);
    saveMe(rec);
    renderStickerGrid();
    showToast('贴图已收藏');
  });
  this.value = '';
};
function compressImage(file, maxPx, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      try {
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxPx / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * scale);
        cv.height = Math.round(h * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        var type = (file.type === 'image/png') ? 'image/png' : 'image/jpeg';
        var out = cv.toDataURL(type, 0.8);
        if (out.length > 500000) {
          out = cv.toDataURL('image/jpeg', 0.5);
          if (out.length > 500000) { cb(null, '压缩后仍过大'); return; }
        }
        cb(out, null);
      } catch(e) { cb(null, e.message); }
    };
    img.onerror = function(){ cb(null, '无法读取该图片'); };
    img.src = reader.result;
  };
  reader.onerror = function(){ cb(null, '读取文件失败'); };
  reader.readAsDataURL(file);
}
function sendSticker(dataUrl){
  if (!currentChat) return;
  var key = currentChat;
  var rec = meRec();
  if (!rec.chats[key]) rec.chats[key] = [];
  var ts = Date.now();
  var msg = { w: 'me', img: dataUrl, ts: ts, pending: true };
  rec.chats[key].push(msg);
  if (rec.chats[key].length > 300) rec.chats[key] = rec.chats[key].slice(-300);
  saveMe(rec);
  renderMsgs();
  hideEmojiPanel();
  if (chatType === 'group') {
    var g = rec.groups[key];
    if (!g) return;
    var payload = { t: 'gmsg', uid: myUid, name: rec.name || me, img: dataUrl, gid: key, ts: ts };
    deliverOrQueue(g.owner, key, payload, ts);
    if (g.owner === myUid) {
      g.members.forEach(function(m){
        if (m.uid === myUid) return;
        deliverOrQueue(m.uid, key, payload, 0);
      });
      markSent(key, ts);
    }
  } else {
    deliverOrQueue(key, key, { t: 'sticker', uid: myUid, img: dataUrl, ts: ts }, ts);
  }
}

/* ═══════════ 备份 / 导入 ═══════════ */
 $('btnBackup').onclick = function(){
  try {
    var data = { app: 'azchat', ver: 2, db: storage.getItem(DB_KEY) };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'azchat-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    showToast('备份文件已开始下载');
  } catch(e) {
    showToast('备份失败：' + e.message, true);
  }
};
 $('btnImport').onclick = function(){ $('importFile').click(); };
 $('importFile').onchange = function(){
  var f = this.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var data = JSON.parse(r.result);
      if (!data || data.app !== 'azchat' || !data.db) { showToast('备份文件格式不正确', true); return; }
      if (!confirm('导入会合并本机数据（同名账号将被备份覆盖），确定继续？')) return;
      var cur = JSON.parse(storage.getItem(DB_KEY) || '{}');
      var back = JSON.parse(data.db);
      var count = 0;
      for (var n in back) {
        back[n] = normalizeAccount(back[n], n) || back[n];
        cur[n] = back[n];
        count++;
      }
      storage.setItem(DB_KEY, JSON.stringify(cur));
      showToast('导入成功，共 ' + count + ' 个账号');
    } catch(e) {
      showToast('导入失败：' + e.message, true);
    }
  };
  r.readAsText(f);
  this.value = '';
};

if (storageIsMemory) {
  setTimeout(function(){ showToast('当前环境禁止本地存储，无法记住登录状态', true); }, 800);
}
